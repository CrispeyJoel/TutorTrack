<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
  />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ledger" />

  <meta name="theme-color" content="#F5F5F2" />
  <meta
    name="description"
    content="A simple teaching schedule, student and payment manager."
  />

  <title>Ledger</title>

  <link rel="manifest" href="manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #f5f5f2;
      --card: #ffffff;
      --card-soft: #eeeee9;
      --ink: #171914;
      --muted: #777870;
      --line: #e1e1db;

      --green: #2f7a5e;
      --blue: #2b5fad;
      --purple: #7a4fb5;
      --gold: #b8862e;
      --orange: #c4542d;
      --red: #a33d3d;

      --radius: 18px;
      --nav-height: 76px;

      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 13px;
      padding: 13px 14px;
      outline: none;
      font-size: 15px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #aaa9a1;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      position: relative;
      padding-bottom: calc(var(--nav-height) + 22px + var(--safe-bottom));
    }

    /* --------------------------------------------------
       HEADER
    -------------------------------------------------- */

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding:
        calc(16px + var(--safe-top))
        20px
        15px;
      background: rgba(245, 245, 242, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(225, 225, 219, 0.65);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-family: "Newsreader", serif;
      font-size: 31px;
      line-height: 1;
      letter-spacing: -0.03em;
      font-weight: 500;
    }

    .header-title {
      font-family: "Newsreader", serif;
      font-size: 29px;
      line-height: 1;
      letter-spacing: -0.025em;
      font-weight: 500;
    }

    .header-date {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .header-action {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
    }

    .header-action:active {
      transform: scale(0.94);
      opacity: 0.85;
    }

    .back-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-button svg {
      width: 18px;
      height: 18px;
    }

    /* --------------------------------------------------
       CONTENT
    -------------------------------------------------- */

    .app-content {
      padding: 22px 18px 0;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: "Newsreader", serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.015em;
    }

    .section-link {
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      padding: 5px;
    }

    /* --------------------------------------------------
       HERO
    -------------------------------------------------- */

    .today-hero {
      padding: 6px 2px 24px;
    }

    .eyebrow {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .hero-title {
      font-family: "Newsreader", serif;
      font-size: 38px;
      line-height: 1.02;
      font-weight: 500;
      letter-spacing: -0.035em;
      max-width: 340px;
    }

    .hero-subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
    }

    /* --------------------------------------------------
       STAT CARDS
    -------------------------------------------------- */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 15px 12px;
      min-height: 95px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-label {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
    }

    .stat-value {
      font-family: "Newsreader", serif;
      font-size: 25px;
      line-height: 1;
      letter-spacing: -0.025em;
    }

    /* --------------------------------------------------
       CARDS
    -------------------------------------------------- */

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .session-card {
      position: relative;
      overflow: hidden;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 13px;
      transition: transform 0.15s;
    }

    .session-card:active {
      transform: scale(0.985);
    }

    .session-color {
      width: 4px;
      align-self: stretch;
      min-height: 57px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .session-main {
      flex: 1;
      min-width: 0;
    }

    .session-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-subject {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .session-right {
      text-align: right;
      flex-shrink: 0;
    }

    .session-time {
      font-size: 14px;
      font-weight: 600;
    }

    .session-duration {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-done {
      background: #e5efe9;
      color: var(--green);
    }

    .status-cancelled {
      background: #f3e4e4;
      color: var(--red);
    }

    /* --------------------------------------------------
       BUTTONS
    -------------------------------------------------- */

    .primary-button {
      width: 100%;
      min-height: 50px;
      border-radius: 14px;
      background: var(--ink);
      color: white;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.15s, opacity 0.15s;
    }

    .primary-button:active {
      transform: scale(0.985);
      opacity: 0.9;
    }

    .secondary-button {
      min-height: 46px;
      padding: 0 17px;
      border-radius: 13px;
      background: var(--card-soft);
      color: var(--ink);
      font-weight: 600;
      font-size: 13px;
    }

    .danger-button {
      width: 100%;
      min-height: 48px;
      border-radius: 13px;
      background: #f3e4e4;
      color: var(--red);
      font-weight: 600;
    }

    .small-button {
      min-height: 38px;
      padding: 0 13px;
      border-radius: 11px;
      background: var(--ink);
      color: white;
      font-size: 12px;
      font-weight: 600;
    }

    .button-row {
      display: flex;
      gap: 9px;
    }

    .button-row > * {
      flex: 1;
    }

    /* --------------------------------------------------
       EMPTY STATES
    -------------------------------------------------- */

    .empty-state {
      padding: 34px 20px;
      text-align: center;
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    .empty-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--card-soft);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg {
      width: 19px;
      height: 19px;
      color: var(--muted);
    }

    .empty-title {
      font-family: "Newsreader", serif;
      font-size: 21px;
    }

    .empty-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 5px;
    }

    /* --------------------------------------------------
       SCHEDULE
    -------------------------------------------------- */

    .week-card {
      background: var(--ink);
      color: white;
      border-radius: 20px;
      padding: 17px;
      margin-bottom: 23px;
    }

    .week-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .week-label {
      font-family: "Newsreader", serif;
      font-size: 22px;
    }

    .week-buttons {
      display: flex;
      gap: 7px;
    }

    .week-button {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .week-button svg {
      width: 15px;
      height: 15px;
    }

    .day-block {
      margin-bottom: 25px;
    }

    .day-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 9px;
      padding: 0 3px;
    }

    .day-name {
      font-family: "Newsreader", serif;
      font-size: 20px;
    }

    .day-date {
      color: var(--muted);
      font-size: 11px;
    }

    .today-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      margin-left: 5px;
      vertical-align: middle;
    }

    /* --------------------------------------------------
       STUDENTS
    -------------------------------------------------- */

    .student-card {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px;
      margin-bottom: 9px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      transition: transform 0.15s;
    }

    .student-card:active {
      transform: scale(0.985);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Newsreader", serif;
      font-size: 19px;
      flex-shrink: 0;
    }

    .student-main {
      min-width: 0;
      flex: 1;
    }

    .student-name {
      font-size: 15px;
      font-weight: 600;
    }

    .student-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .balance {
      text-align: right;
      flex-shrink: 0;
    }

    .balance-label {
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .balance-value {
      margin-top: 2px;
      font-size: 14px;
      font-weight: 600;
    }

    .balance-positive {
      color: var(--red);
    }

    .balance-clear {
      color: var(--green);
    }

    /* --------------------------------------------------
       STUDENT DETAIL
    -------------------------------------------------- */

    .profile-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 15px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .profile-avatar {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: var(--ink);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Newsreader", serif;
      font-size: 26px;
    }

    .profile-name {
      font-family: "Newsreader", serif;
      font-size: 29px;
      line-height: 1;
    }

    .profile-detail {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
    }

    .subject-chip {
      padding: 6px 9px;
      border-radius: 20px;
      color: white;
      font-size: 10px;
      font-weight: 600;
    }

    .balance-large {
      margin-top: 18px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: end;
      justify-content: space-between;
    }

    .balance-large-label {
      color: var(--muted);
      font-size: 11px;
    }

    .balance-large-value {
      font-family: "Newsreader", serif;
      font-size: 32px;
    }

    .info-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 10px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-label {
      color: var(--muted);
      font-size: 12px;
    }

    .info-value {
      text-align: right;
      font-size: 13px;
      font-weight: 500;
    }

    .note-card {
      background: #f0eee6;
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 8px;
    }

    .note-date {
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 5px;
    }

    .note-text {
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* --------------------------------------------------
       PAYMENTS
    -------------------------------------------------- */

    .money-card {
      padding: 18px;
      margin-bottom: 9px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .money-name {
      font-weight: 600;
      font-size: 14px;
    }

    .money-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .money-amount {
      font-family: "Newsreader", serif;
      font-size: 23px;
      color: var(--red);
    }

    .payment-history-card {
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .payment-date {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .payment-amount {
      color: var(--green);
      font-weight: 600;
    }

    /* --------------------------------------------------
       FORM
    -------------------------------------------------- */

    .field {
      margin-bottom: 15px;
    }

    .field-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .subject-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .subject-option {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: white;
      text-align: left;
      font-size: 13px;
      transition: border-color 0.15s, background 0.15s;
    }

    .subject-option.selected {
      border-color: var(--ink);
      background: var(--card-soft);
      font-weight: 600;
    }

    /* --------------------------------------------------
       BOTTOM NAV
    -------------------------------------------------- */

    .bottom-nav {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(480px, 100%);
      padding: 8px 12px calc(8px + var(--safe-bottom));
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--line);
    }

    .bottom-nav-inner {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
    }

    .nav-item {
      height: 54px;
      border-radius: 15px;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.8;
    }

    .nav-item.active {
      background: var(--ink);
      color: white;
    }

    /* --------------------------------------------------
       FAB
    -------------------------------------------------- */

    .fab {
      position: fixed;
      z-index: 25;
      right: max(20px, calc((100vw - 480px) / 2 + 20px));
      bottom: calc(92px + var(--safe-bottom));
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--ink);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
      transition: transform 0.15s;
    }

    .fab:active {
      transform: scale(0.92);
    }

    .fab svg {
      width: 21px;
      height: 21px;
    }

    /* --------------------------------------------------
       MODALS
    -------------------------------------------------- */

    #modal-root {
      position: relative;
      z-index: 100;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.36);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn 0.18s ease;
    }

    .modal-sheet {
      width: min(480px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: var(--bg);
      border-radius: 25px 25px 0 0;
      padding: 10px 20px calc(22px + var(--safe-bottom));
      animation: slideUp 0.22s ease;
    }

    .modal-handle {
      width: 38px;
      height: 4px;
      border-radius: 5px;
      background: #c9c9c2;
      margin: 4px auto 20px;
    }

    .modal-title {
      font-family: "Newsreader", serif;
      font-size: 28px;
      margin-bottom: 20px;
      letter-spacing: -0.025em;
    }

    .modal-close {
      position: absolute;
      right: 17px;
      top: 15px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close svg {
      width: 16px;
      height: 16px;
    }

    .modal-content {
      position: relative;
    }

    /* --------------------------------------------------
       QUICK ACTIONS
    -------------------------------------------------- */

    .action-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-button {
      min-height: 52px;
      padding: 0 15px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      text-align: left;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .action-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--card-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-icon svg {
      width: 16px;
      height: 16px;
    }

    /* --------------------------------------------------
       ANIMATIONS
    -------------------------------------------------- */

    .fade-enter {
      animation: fadeUp 0.2s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    /* --------------------------------------------------
       DESKTOP
    -------------------------------------------------- */

    @media (min-width: 600px) {
      body {
        background: #e9e9e4;
      }

      #app {
        background: var(--bg);
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.08);
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="modal-root"></div>

  <script>
    /* ==================================================
       ICONS
    ================================================== */

    const icons = {
      plus: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
        </svg>
      `,

      back: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `,

      today: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="4" width="18" height="17" rx="3"/>
          <path d="M8 2v4M16 2v4M3 9h18"/>
          <path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/>
        </svg>
      `,

      calendar: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="4" width="18" height="17" rx="3"/>
          <path d="M8 2v4M16 2v4M3 9h18"/>
        </svg>
      `,

      users: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="9" cy="8" r="3"/>
          <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
          <path d="M16 5.5a3 3 0 0 1 0 5.8M18 14c2 .8 3 2.5 3 5"/>
        </svg>
      `,

      money: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="9"/>
          <path d="M15 9.5c-.5-1-1.5-1.5-3-1.5-1.7 0-3 .8-3 2s1.2 1.8 3 2c1.8.2 3 .9 3 2.2s-1.2 2.3-3 2.3c-1.5 0-2.7-.6-3.2-1.7"/>
          <path d="M12 6v12"/>
        </svg>
      `,

      note: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M5 4h14v16H5z"/>
          <path d="M8 8h8M8 12h8M8 16h5"/>
        </svg>
      `,

      check: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M5 12l4 4L19 6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `,

      edit: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M4 20h4L19 9l-4-4L4 16v4z"/>
          <path d="M13.5 6.5l4 4"/>
        </svg>
      `,

      trash: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M4 7h16M10 11v6M14 11v6"/>
          <path d="M6 7l1 14h10l1-14M9 7V4h6v3"/>
        </svg>
      `,

      chevronLeft: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `,

      chevronRight: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `,

      close: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/>
        </svg>
      `
    };

    /* ==================================================
       DATA
    ================================================== */

    const STORAGE_KEY = "ledger-data";

    let data = {
      students: [],
      sessions: [],
      payments: []
    };

    let loaded = false;
    let view = "today";
    let openStudentId = null;
    let weekOffset = 0;

    function uid() {
      return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
          const parsed = JSON.parse(saved);

          data = {
            students: Array.isArray(parsed.students) ? parsed.students : [],
            sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [],
            payments: Array.isArray(parsed.payments) ? parsed.payments : []
          };
        }
      } catch (error) {
        console.error("Could not load Ledger data", error);
      }

      loaded = true;
      render();
    }

    let saveTimer;

    function saveData() {
      clearTimeout(saveTimer);

      saveTimer = setTimeout(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }, 120);
    }

    /* ==================================================
       DATE / MONEY HELPERS
    ================================================== */

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function todayISO() {
      const d = new Date();

      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function isoToDate(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function dateToISO(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function addDays(iso, amount) {
      const d = isoToDate(iso);
      d.setDate(d.getDate() + amount);
      return dateToISO(d);
    }

    function fmtMoney(value) {
      return new Intl.NumberFormat("en-AU", {
        style: "currency",
        currency: "AUD",
        maximumFractionDigits: 2
      }).format(Number(value) || 0);
    }

    function dayLabel(iso) {
      return isoToDate(iso).toLocaleDateString("en-AU", {
        weekday: "long"
      });
    }

    function shortDate(iso) {
      return isoToDate(iso).toLocaleDateString("en-AU", {
        day: "numeric",
        month: "short"
      });
    }

    function time12(time) {
      if (!time) return "";

      const [h, m] = time.split(":").map(Number);

      const suffix = h >= 12 ? "PM" : "AM";
      const hour = h % 12 || 12;

      return `${hour}:${pad(m)} ${suffix}`;
    }

    function startOfWeek(date) {
      const d = new Date(date);
      const day = d.getDay();

      const diff = day === 0 ? -6 : 1 - day;

      d.setDate(d.getDate() + diff);

      return d;
    }

    function weekDates(offset = 0) {
      const start = startOfWeek(new Date());

      start.setDate(start.getDate() + offset * 7);

      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        return dateToISO(d);
      });
    }

    function studentById(id) {
      return data.students.find(s => s.id === id);
    }

    function subjectColor(subject) {
      const colors = {
        Maths: "#2B5FAD",
        Physics: "#7A4FB5",
        English: "#B8862E",
        Piano: "#2F7A5E",
        Percussion: "#C4542D",
        Other: "#6B6B63"
      };

      return colors[subject] || colors.Other;
    }

    function sessionCost(session) {
      const student = studentById(session.studentId);

      if (!student) return 0;

      return (Number(student.rate) || 0) * ((Number(session.duration) || 0) / 60);
    }

    function studentBalance(studentId) {
      const earned = data.sessions
        .filter(s =>
          s.studentId === studentId &&
          s.status !== "cancelled"
        )
        .reduce((sum, s) => sum + sessionCost(s), 0);

      const paid = data.payments
        .filter(p => p.studentId === studentId)
        .reduce((sum, p) => sum + (Number(p.amount) || 0), 0);

      return earned - paid;
    }

    function totalOutstanding() {
      return data.students.reduce(
        (sum, student) => sum + Math.max(0, studentBalance(student.id)),
        0
      );
    }

    function hoursThisWeek() {
      const dates = weekDates(0);

      return data.sessions
        .filter(s =>
          dates.includes(s.date) &&
          s.status !== "cancelled"
        )
        .reduce((sum, s) => sum + (Number(s.duration) || 0) / 60, 0);
    }

    /* ==================================================
       RENDER
    ================================================== */

    function render() {
      const app = document.getElementById("app");

      if (!loaded) {
        app.innerHTML = "";
        return;
      }

      let body;

      if (view === "student") {
        body = renderStudentDetail(openStudentId);
      } else if (view === "schedule") {
        body = renderSchedule();
      } else if (view === "students") {
        body = renderStudents();
      } else if (view === "payments") {
        body = renderPayments();
      } else {
        body = renderToday();
      }

      app.innerHTML = `
        ${renderHeader()}

        <main class="app-content fade-enter">
          ${body}
        </main>

        ${
          view === "student"
            ? ""
            : `
              <button class="fab" data-action="quick-add">
                ${icons.plus}
              </button>

              ${renderTabBar()}
            `
        }
      `;

      attachHandlers();
    }

    /* ==================================================
       HEADER
    ================================================== */

    function renderHeader() {
      if (view === "student") {
        const student = studentById(openStudentId);

        return `
          <header class="app-header">
            <div class="header-row">
              <button class="back-button" data-action="back">
                ${icons.back}
              </button>

              <div style="flex:1">
                <div class="header-title">${student ? escapeHTML(student.name) : "Student"}</div>
              </div>

              ${
                student
                  ? `
                    <button class="header-action" data-action="edit-student" data-id="${student.id}">
                      ${icons.edit}
                    </button>
                  `
                  : ""
              }
            </div>
          </header>
        `;
      }

      const titles = {
        today: "Today",
        schedule: "Schedule",
        students: "Students",
        payments: "Payments"
      };

      const title = titles[view] || "Ledger";

      return `
        <header class="app-header">
          <div class="header-row">
            <div>
              <div class="brand">Ledger</div>
              <div class="header-date">${title}</div>
            </div>

            <button class="header-action" data-action="quick-add">
              ${icons.plus}
            </button>
          </div>
        </header>
      `;
    }

    /* ==================================================
       TODAY
    ================================================== */

    function renderToday() {
      const today = todayISO();

      const sessions = data.sessions
        .filter(s => s.date === today)
        .sort((a, b) => String(a.time).localeCompare(String(b.time)));

      const dateText = new Date().toLocaleDateString("en-AU", {
        weekday: "long",
        day: "numeric",
        month: "long"
      });

      return `
        <div class="today-hero">
          <div class="eyebrow">${dateText}</div>
          <div class="hero-title">${getGreeting()}</div>
          <div class="hero-subtitle">
            ${sessions.length === 0
              ? "Nothing scheduled today."
              : `${sessions.length} session${sessions.length === 1 ? "" : "s"} on the calendar.`}
          </div>
        </div>

        <div class="stats-grid">
          ${statCard("Sessions", sessions.length)}
          ${statCard("Hours", `${hoursThisWeek().toFixed(1)}h`)}
          ${statCard("Owed", fmtMoney(totalOutstanding()))}
        </div>

        <section class="section">
          <div class="section-header">
            <div class="section-title">Today</div>
            <button class="section-link" data-action="nav" data-view="schedule">
              View week
            </button>
          </div>

          ${
            sessions.length
              ? sessions.map(sessionRow).join("")
              : emptyState(
                  "Nothing scheduled",
                  "Add a lesson or session to get started."
                )
          }
        </section>
      `;
    }

    function getGreeting() {
      const hour = new Date().getHours();

      if (hour < 12) return "Good morning.";
      if (hour < 18) return "Good afternoon.";

      return "Good evening.";
    }

    function statCard(label, value) {
      return `
        <div class="stat-card">
          <div class="stat-label">${label}</div>
          <div class="stat-value">${value}</div>
        </div>
      `;
    }

    function emptyState(title, text) {
      return `
        <div class="empty-state">
          <div class="empty-icon">
            ${icons.calendar}
          </div>

          <div class="empty-title">${title}</div>
          <div class="empty-text">${text}</div>
        </div>
      `;
    }

    function sessionRow(session) {
      const student = studentById(session.studentId);

      if (!student) return "";

      const color = subjectColor(session.subject);

      let status = "";

      if (session.status === "completed") {
        status = `
          <div class="status-pill status-done">
            ${icons.check}
            Done
          </div>
        `;
      }

      if (session.status === "cancelled") {
        status = `
          <div class="status-pill status-cancelled">
            Cancelled
          </div>
        `;
      }

      return `
        <div
          class="session-card"
          data-action="open-session"
          data-id="${session.id}"
        >
          <div
            class="session-color"
            style="background:${color}"
          ></div>

          <div class="session-main">
            <div class="session-name">
              ${escapeHTML(student.name)}
            </div>

            <div class="session-subject">
              ${escapeHTML(session.subject || "Session")}
              · ${session.duration || 60} min
            </div>
          </div>

          <div class="session-right">
            <div class="session-time">
              ${time12(session.time)}
            </div>

            <div class="session-duration">
              ${fmtMoney(sessionCost(session))}
            </div>

            ${status}
          </div>
        </div>
      `;
    }

    /* ==================================================
       SCHEDULE
    ================================================== */

    function renderSchedule() {
      const dates = weekDates(weekOffset);

      const first = isoToDate(dates[0]);
      const last = isoToDate(dates[6]);

      const range = `${first.toLocaleDateString("en-AU", {
        day: "numeric",
        month: "short"
      })} – ${last.toLocaleDateString("en-AU", {
        day: "numeric",
        month: "short"
      })}`;

      return `
        <div class="week-card">
          <div class="week-navigation">
            <div>
              <div class="eyebrow" style="color:#aaa">Week</div>
              <div class="week-label">${range}</div>
            </div>

            <div class="week-buttons">
              <button class="week-button" data-action="prev-week">
                ${icons.chevronLeft}
              </button>

              <button class="week-button" data-action="next-week">
                ${icons.chevronRight}
              </button>
            </div>
          </div>
        </div>

        ${dates.map(renderDay).join("")}
      `;
    }

    function renderDay(date) {
      const sessions = data.sessions
        .filter(s => s.date === date)
        .sort((a, b) => String(a.time).localeCompare(String(b.time)));

      const isToday = date === todayISO();

      return `
        <section class="day-block">
          <div class="day-heading">
            <div class="day-name">
              ${dayLabel(date)}
              ${isToday ? '<span class="today-dot"></span>' : ""}
            </div>

            <div class="day-date">${shortDate(date)}</div>
          </div>

          ${
            sessions.length
              ? sessions.map(sessionRow).join("")
              : `
                <div
                  style="
                    color:var(--muted);
                    font-size:12px;
                    padding:10px 3px;
                  "
                >
                  No sessions
                </div>
              `
          }
        </section>
      `;
    }

    /* ==================================================
       STUDENTS
    ================================================== */

    function renderStudents() {
      const students = [...data.students].sort((a, b) =>
        a.name.localeCompare(b.name)
      );

      return `
        <section class="section">
          <div class="section-header">
            <div class="section-title">
              ${students.length} ${students.length === 1 ? "student" : "students"}
            </div>

            <button
              class="small-button"
              data-action="add-student"
            >
              ${icons.plus}
              Add
            </button>
          </div>

          ${
            students.length
              ? students.map(studentRow).join("")
              : emptyState(
                  "No students yet",
                  "Add your first student to start building your ledger."
                )
          }
        </section>
      `;
    }

    function studentRow(student) {
      const balance = studentBalance(student.id);

      const subjects = Array.isArray(student.subjects)
        ? student.subjects.join(", ")
        : "";

      return `
        <div
          class="student-card"
          data-action="open-student"
          data-id="${student.id}"
        >
          <div class="avatar">
            ${escapeHTML(student.name.charAt(0).toUpperCase())}
          </div>

          <div class="student-main">
            <div class="student-name">
              ${escapeHTML(student.name)}
            </div>

            <div class="student-meta">
              ${escapeHTML(subjects || "No subjects")}
              ${student.rate ? ` · ${fmtMoney(student.rate)}/hr` : ""}
            </div>
          </div>

          <div class="balance">
            <div class="balance-label">
              Balance
            </div>

            <div class="
              balance-value
              ${balance > 0 ? "balance-positive" : "balance-clear"}
            ">
              ${balance > 0 ? fmtMoney(balance) : "Clear"}
            </div>
          </div>
        </div>
      `;
    }

    /* ==================================================
       STUDENT DETAIL
    ================================================== */

    function renderStudentDetail(id) {
      const student = studentById(id);

      if (!student) {
        view = "students";
        return renderStudents();
      }

      const balance = studentBalance(student.id);

      const sessions = data.sessions
        .filter(s => s.studentId === student.id)
        .sort((a, b) =>
          `${b.date}${b.time}`.localeCompare(`${a.date}${a.time}`)
        );

      const payments = data.payments
        .filter(p => p.studentId === student.id)
        .sort((a, b) => String(b.date).localeCompare(String(a.date)));

      const notes = Array.isArray(student.notes)
        ? [...student.notes].reverse()
        : [];

      const subjects = Array.isArray(student.subjects)
        ? student.subjects
        : [];

      return `
        <section class="section">
          <div class="profile-card">
            <div class="profile-top">
              <div class="profile-avatar">
                ${escapeHTML(student.name.charAt(0).toUpperCase())}
              </div>

              <div>
                <div class="profile-name">
                  ${escapeHTML(student.name)}
                </div>

                ${
                  student.phone
                    ? `
                      <div class="profile-detail">
                        ${escapeHTML(student.phone)}
                      </div>
                    `
                    : ""
                }
              </div>
            </div>

            ${
              subjects.length
                ? `
                  <div class="chip-row">
                    ${subjects
                      .map(
                        subject => `
                          <div
                            class="subject-chip"
                            style="background:${subjectColor(subject)}"
                          >
                            ${escapeHTML(subject)}
                          </div>
                        `
                      )
                      .join("")}
                  </div>
                `
                : ""
            }

            <div class="balance-large">
              <div class="balance-large-label">
                Outstanding balance
              </div>

              <div class="balance-large-value ${
                balance > 0 ? "balance-positive" : "balance-clear"
              }">
                ${balance > 0 ? fmtMoney(balance) : "$0"}
              </div>
            </div>
          </div>

          <div class="button-row" style="margin-bottom:25px">
            <button
              class="secondary-button"
              data-action="edit-student"
              data-id="${student.id}"
            >
              Edit details
            </button>

            <button
              class="primary-button"
              data-action="add-payment"
              data-student="${student.id}"
            >
              Log payment
            </button>
          </div>
        </section>

        <section class="section">
          <div class="section-header">
            <div class="section-title">Notes</div>

            <button
              class="section-link"
              data-action="add-note"
              data-student="${student.id}"
            >
              + Add note
            </button>
          </div>

          ${
            notes.length
              ? notes
                  .map(
                    note => `
                      <div class="note-card">
                        <div class="note-date">
                          ${note.date ? shortDate(note.date) : ""}
                        </div>

                        <div class="note-text">
                          ${escapeHTML(note.text || "")}
                        </div>
                      </div>
                    `
                  )
                  .join("")
              : `
                <div class="info-card">
                  <div style="color:var(--muted);font-size:12px">
                    No notes yet.
                  </div>
                </div>
              `
          }
        </section>

        <section class="section">
          <div class="section-header">
            <div class="section-title">Session history</div>

            <button
              class="section-link"
              data-action="add-session"
              data-student="${student.id}"
            >
              + Add session
            </button>
          </div>

          ${
            sessions.length
              ? sessions.map(sessionHistoryRow).join("")
              : `
                <div class="info-card">
                  <div style="color:var(--muted);font-size:12px">
                    No sessions yet.
                  </div>
                </div>
              `
          }
        </section>

        <section class="section">
          <div class="section-header">
            <div class="section-title">Payments</div>
          </div>

          ${
            payments.length
              ? payments.map(paymentHistoryRow).join("")
              : `
                <div class="info-card">
                  <div style="color:var(--muted);font-size:12px">
                    No payments recorded.
                  </div>
                </div>
              `
          }
        </section>

        <section class="section">
          <button
            class="danger-button"
            data-action="delete-student"
            data-id="${student.id}"
          >
            Delete student
          </button>
        </section>
      `;
    }

    function sessionHistoryRow(session) {
      return `
        <div
          class="info-card"
          data-action="open-session"
          data-id="${session.id}"
        >
          <div class="info-row">
            <div class="info-label">
              ${shortDate(session.date)}
            </div>

            <div class="info-value">
              ${time12(session.time)}
            </div>
          </div>

          <div class="info-row">
            <div class="info-label">
              ${escapeHTML(session.subject || "Session")}
            </div>

            <div class="info-value">
              ${session.duration || 60} min · ${fmtMoney(sessionCost(session))}
            </div>
          </div>

          <div class="info-row">
            <div class="info-label">Status</div>
            <div class="info-value">
              ${session.status || "scheduled"}
            </div>
          </div>
        </div>
      `;
    }

    function paymentHistoryRow(payment) {
      return `
        <div class="payment-history-card">
          <div>
            <div style="font-size:13px;font-weight:500">
              Payment
            </div>

            <div class="payment-date">
              ${shortDate(payment.date)}
              ${payment.note ? ` · ${escapeHTML(payment.note)}` : ""}
            </div>
          </div>

          <div class="payment-amount">
            +${fmtMoney(payment.amount)}
          </div>
        </div>
      `;
    }

    /* ==================================================
       PAYMENTS
    ================================================== */

    function renderPayments() {
      const outstanding = data.students
        .map(student => ({
          student,
          balance: studentBalance(student.id)
        }))
        .filter(x => x.balance > 0)
        .sort((a, b) => b.balance - a.balance);

      const history = [...data.payments]
        .sort((a, b) => String(b.date).localeCompare(String(a.date)))
        .slice(0, 30);

      return `
        <section class="section">
          <div class="section-header">
            <div class="section-title">Outstanding</div>

            <div style="font-family:'Newsreader';font-size:22px">
              ${fmtMoney(totalOutstanding())}
            </div>
          </div>

          ${
            outstanding.length
              ? outstanding
                  .map(
                    ({ student, balance }) => `
                      <div class="money-card">
                        <div>
                          <div class="money-name">
                            ${escapeHTML(student.name)}
                          </div>

                          <div class="money-meta">
                            ${student.rate ? fmtMoney(student.rate) + "/hr" : ""}
                          </div>
                        </div>

                        <div style="display:flex;align-items:center;gap:9px">
                          <div class="money-amount">
                            ${fmtMoney(balance)}
                          </div>

                          <button
                            class="small-button"
                            data-action="add-payment"
                            data-student="${student.id}"
                          >
                            Pay
                          </button>
                        </div>
                      </div>
                    `
                  )
                  .join("")
              : emptyState(
                  "All clear",
                  "No outstanding payments."
                )
          }
        </section>

        <section class="section">
          <div class="section-header">
            <div class="section-title">Payment history</div>
          </div>

          ${
            history.length
              ? history
                  .map(payment => {
                    const student = studentById(payment.studentId);

                    return `
                      <div class="payment-history-card">
                        <div>
                          <div style="font-size:13px;font-weight:500">
                            ${escapeHTML(student?.name || "Unknown")}
                          </div>

                          <div class="payment-date">
                            ${shortDate(payment.date)}
                            ${payment.note ? ` · ${escapeHTML(payment.note)}` : ""}
                          </div>
                        </div>

                        <div class="payment-amount">
                          +${fmtMoney(payment.amount)}
                        </div>
                      </div>
                    `;
                  })
                  .join("")
              : emptyState(
                  "No payments",
                  "Payments you log will appear here."
                )
          }
        </section>
      `;
    }

    /* ==================================================
       NAVIGATION
    ================================================== */

    function renderTabBar() {
      const tabs = [
        ["today", icons.today, "Today"],
        ["schedule", icons.calendar, "Schedule"],
        ["students", icons.users, "Students"],
        ["payments", icons.money, "Payments"]
      ];

      return `
        <nav class="bottom-nav">
          <div class="bottom-nav-inner">
            ${tabs
              .map(
                ([id, icon, label]) => `
                  <button
                    class="nav-item ${view === id ? "active" : ""}"
                    data-action="nav"
                    data-view="${id}"
                  >
                    ${icon}
                    <span>${label}</span>
                  </button>
                `
              )
              .join("")}
          </div>
        </nav>
      `;
    }

    /* ==================================================
       MODAL HELPERS
    ================================================== */

    function openModal(content) {
      document.getElementById("modal-root").innerHTML = `
        <div class="modal-backdrop" data-action="close-modal">
          <div
            class="modal-sheet"
            data-modal-content
          >
            <div class="modal-handle"></div>

            ${content}
          </div>
        </div>
      `;

      document
        .querySelector(".modal-backdrop")
        ?.addEventListener("click", e => {
          if (e.target.classList.contains("modal-backdrop")) {
            closeModal();
          }
        });
    }

    function closeModal() {
      document.getElementById("modal-root").innerHTML = "";
    }

    function modalShell(title, body) {
      return `
        <div class="modal-content">
          <button
            class="modal-close"
            data-action="close-modal"
          >
            ${icons.close}
          </button>

          <div class="modal-title">${title}</div>

          ${body}
        </div>
      `;
    }

    /* ==================================================
       STUDENT FORM
    ================================================== */

    function studentFormModal(student = null) {
      const editing = !!student;

      const subjects = [
        "Maths",
        "Physics",
        "English",
        "Piano",
        "Percussion",
        "Other"
      ];

      const selected = Array.isArray(student?.subjects)
        ? student.subjects
        : [];

      openModal(
        modalShell(
          editing ? "Edit student" : "New student",
          `
            <form id="student-form">
              <div class="field">
                <label class="field-label">Name</label>

                <input
                  name="name"
                  required
                  value="${escapeAttr(student?.name || "")}"
                  placeholder="Student name"
                />
              </div>

              <div class="field">
                <label class="field-label">Phone</label>

                <input
                  name="phone"
                  value="${escapeAttr(student?.phone || "")}"
                  placeholder="Phone number"
                  type="tel"
                />
              </div>

              <div class="field">
                <label class="field-label">Hourly rate</label>

                <input
                  name="rate"
                  type="number"
                  min="0"
                  step="0.01"
                  value="${student?.rate ?? ""}"
                  placeholder="60"
                />
              </div>

              <div class="field">
                <label class="field-label">Subjects</label>

                <div class="subject-options">
                  ${subjects
                    .map(
                      subject => `
                        <button
                          type="button"
                          class="subject-option ${
                            selected.includes(subject) ? "selected" : ""
                          }"
                          data-subject-option="${subject}"
                        >
                          ${subject}
                        </button>
                      `
                    )
                    .join("")}
                </div>
              </div>

              <button class="primary-button" type="submit">
                ${editing ? "Save changes" : "Add student"}
              </button>
            </form>
          `
        )
      );

      document
        .querySelectorAll("[data-subject-option]")
        .forEach(button => {
          button.addEventListener("click", () => {
            button.classList.toggle("selected");
          });
        });

      document
        .getElementById("student-form")
        .addEventListener("submit", e => {
          e.preventDefault();

          const form = new FormData(e.currentTarget);

          const selectedSubjects = [
            ...document.querySelectorAll(".subject-option.selected")
          ].map(el => el.dataset.subjectOption);

          const record = {
            id: student?.id || uid(),
            name: String(form.get("name") || "").trim(),
            phone: String(form.get("phone") || "").trim(),
            rate: Number(form.get("rate")) || 0,
            subjects: selectedSubjects,
            notes: student?.notes || []
          };

          if (editing) {
            const index = data.students.findIndex(s => s.id === student.id);

            if (index !== -1) {
              data.students[index] = record;
            }
          } else {
            data.students.push(record);
          }

          saveData();
          closeModal();
          render();
        });
    }

    /* ==================================================
       SESSION FORM
    ================================================== */

    function sessionFormModal(session = null, presetStudentId = null) {
      const editing = !!session;

      const students = [...data.students].sort((a, b) =>
        a.name.localeCompare(b.name)
      );

      openModal(
        modalShell(
          editing ? "Edit session" : "New session",
          `
            <form id="session-form">
              <div class="field">
                <label class="field-label">Student</label>

                <select name="studentId" required>
                  <option value="">Select student</option>

                  ${students
                    .map(
                      student => `
                        <option
                          value="${student.id}"
                          ${
                            (session?.studentId || presetStudentId) === student.id
                              ? "selected"
                              : ""
                          }
                        >
                          ${escapeHTML(student.name)}
                        </option>
                      `
                    )
                    .join("")}
                </select>
              </div>

              <div class="field">
                <label class="field-label">Subject</label>

                <select name="subject">
                  ${[
                    "Maths",
                    "Physics",
                    "English",
                    "Piano",
                    "Percussion",
                    "Other"
                  ]
                    .map(
                      subject => `
                        <option
                          ${
                            (session?.subject || "") === subject
                              ? "selected"
                              : ""
                          }
                        >
                          ${subject}
                        </option>
                      `
                    )
                    .join("")}
                </select>
              </div>

              <div class="field">
                <label class="field-label">Date</label>

                <input
                  name="date"
                  type="date"
                  required
                  value="${session?.date || todayISO()}"
                />
              </div>

              <div class="field">
                <label class="field-label">Time</label>

                <input
                  name="time"
                  type="time"
                  required
                  value="${session?.time || "16:00"}"
                />
              </div>

              <div class="field">
                <label class="field-label">Duration</label>

                <select name="duration">
                  ${[30, 45, 60, 75, 90, 120]
                    .map(
                      duration => `
                        <option
                          value="${duration}"
                          ${
                            Number(session?.duration || 60) === duration
                              ? "selected"
                              : ""
                          }
                        >
                          ${duration} minutes
                        </option>
                      `
                    )
                    .join("")}
                </select>
              </div>

              <div class="field">
                <label class="field-label">Status</label>

                <select name="status">
                  ${["scheduled", "completed", "cancelled"]
                    .map(
                      status => `
                        <option
                          value="${status}"
                          ${
                            (session?.status || "scheduled") === status
                              ? "selected"
                              : ""
                          }
                        >
                          ${status.charAt(0).toUpperCase() + status.slice(1)}
                        </option>
                      `
                    )
                    .join("")}
                </select>
              </div>

              <button class="primary-button" type="submit">
                ${editing ? "Save session" : "Add session"}
              </button>
            </form>
          `
        )
      );

      document
        .getElementById("session-form")
        .addEventListener("submit", e => {
          e.preventDefault();

          const form = new FormData(e.currentTarget);

          const record = {
            id: session?.id || uid(),
            studentId: String(form.get("studentId")),
            subject: String(form.get("subject")),
            date: String(form.get("date")),
            time: String(form.get("time")),
            duration: Number(form.get("duration")) || 60,
            status: String(form.get("status"))
          };

          if (editing) {
            const index = data.sessions.findIndex(s => s.id === session.id);

            if (index !== -1) {
              data.sessions[index] = record;
            }
          } else {
            data.sessions.push(record);
          }

          saveData();
          closeModal();
          render();
        });
    }

    /* ==================================================
       SESSION ACTIONS
    ================================================== */

    function sessionActionsModal(sessionId) {
      const session = data.sessions.find(s => s.id === sessionId);

      if (!session) return;

      const student = studentById(session.studentId);

      openModal(
        modalShell(
          student ? escapeHTML(student.name) : "Session",
          `
            <div class="action-list">
              <button
                class="action-button"
                data-action="edit-session"
                data-id="${session.id}"
              >
                <span class="action-icon">
                  ${icons.edit}
                </span>

                Edit session
              </button>

              ${
                session.status !== "completed"
                  ? `
                    <button
                      class="action-button"
                      data-action="complete-session"
                      data-id="${session.id}"
                    >
                      <span class="action-icon">
                        ${icons.check}
                      </span>

                      Mark completed
                    </button>
                  `
                  : ""
              }

              <button
                class="action-button"
                data-action="cancel-session"
                data-id="${session.id}"
              >
                <span class="action-icon">
                  ${icons.close}
                </span>

                Cancel session
              </button>

              <button
                class="action-button"
                data-action="delete-session"
                data-id="${session.id}"
                style="color:var(--red)"
              >
                <span class="action-icon">
                  ${icons.trash}
                </span>

                Delete session
              </button>
            </div>
          `
        )
      );
    }

    /* ==================================================
       PAYMENT FORM
    ================================================== */

    function paymentFormModal(studentId = null) {
      const students = [...data.students].sort((a, b) =>
        a.name.localeCompare(b.name)
      );

      openModal(
        modalShell(
          "Log payment",
          `
            <form id="payment-form">
              <div class="field">
                <label class="field-label">Student</label>

                <select name="studentId" required>
                  <option value="">Select student</option>

                  ${students
                    .map(
                      student => `
                        <option
                          value="${student.id}"
                          ${
                            student.id === studentId ? "selected" : ""
                          }
                        >
                          ${escapeHTML(student.name)}
                        </option>
                      `
                    )
                    .join("")}
                </select>
              </div>

              <div class="field">
                <label class="field-label">Amount</label>

                <input
                  name="amount"
                  type="number"
                  min="0"
                  step="0.01"
                  required
                  placeholder="60"
                />
              </div>

              <div class="field">
                <label class="field-label">Date</label>

                <input
                  name="date"
                  type="date"
                  required
                  value="${todayISO()}"
                />
              </div>

              <div class="field">
                <label class="field-label">Note</label>

                <input
                  name="note"
                  placeholder="Optional"
                />
              </div>

              <button class="primary-button" type="submit">
                Save payment
              </button>
            </form>
          `
        )
      );

      document
        .getElementById("payment-form")
        .addEventListener("submit", e => {
          e.preventDefault();

          const form = new FormData(e.currentTarget);

          data.payments.push({
            id: uid(),
            studentId: String(form.get("studentId")),
            amount: Number(form.get("amount")) || 0,
            date: String(form.get("date")),
            note: String(form.get("note") || "").trim()
          });

          saveData();
          closeModal();
          render();
        });
    }

    /* ==================================================
       NOTE FORM
    ================================================== */

    function noteFormModal(studentId) {
      openModal(
        modalShell(
          "Add note",
          `
            <form id="note-form">
              <div class="field">
                <label class="field-label">Note</label>

                <textarea
                  name="text"
                  required
                  placeholder="Write a note about this student..."
                ></textarea>
              </div>

              <button class="primary-button" type="submit">
                Save note
              </button>
            </form>
          `
        )
      );

      document
        .getElementById("note-form")
        .addEventListener("submit", e => {
          e.preventDefault();

          const student = studentById(studentId);

          if (!student) return;

          const form = new FormData(e.currentTarget);

          if (!Array.isArray(student.notes)) {
            student.notes = [];
          }

          student.notes.push({
            id: uid(),
            date: todayISO(),
            text: String(form.get("text") || "").trim()
          });

          saveData();
          closeModal();
          render();
        });
    }

    /* ==================================================
       QUICK ADD
    ================================================== */

    function quickAddModal() {
      openModal(
        modalShell(
          "Add",
          `
            <div class="action-list">
              <button class="action-button" data-action="add-session">
                <span class="action-icon">
                  ${icons.calendar}
                </span>

                New session
              </button>

              <button class="action-button" data-action="add-student">
                <span class="action-icon">
                  ${icons.users}
                </span>

                New student
              </button>

              <button class="action-button" data-action="add-payment">
                <span class="action-icon">
                  ${icons.money}
                </span>

                Log payment
              </button>
            </div>
          `
        )
      );
    }

    /* ==================================================
       EVENTS
    ================================================== */

    function attachHandlers() {
      document.querySelectorAll("[data-action]").forEach(el => {
        el.addEventListener("click", handleAction);
      });
    }

    function handleAction(e) {
      const el = e.currentTarget;
      const action = el.dataset.action;

      if (action === "nav") {
        view = el.dataset.view;
        openStudentId = null;
        weekOffset = 0;
        render();
        return;
      }

      if (action === "back") {
        view = "students";
        openStudentId = null;
        render();
        return;
      }

      if (action === "quick-add") {
        quickAddModal();
        return;
      }

      if (action === "close-modal") {
        closeModal();
        return;
      }

      if (action === "add-student") {
        studentFormModal();
        return;
      }

      if (action === "edit-student") {
        const student = studentById(el.dataset.id);

        if (student) {
          studentFormModal(student);
        }

        return;
      }

      if (action === "open-student") {
        openStudentId = el.dataset.id;
        view = "student";
        render();
        return;
      }

      if (action === "add-session") {
        closeModal();
        sessionFormModal(
          null,
          el.dataset.student || null
        );
        return;
      }

      if (action === "edit-session") {
        const session = data.sessions.find(
          s => s.id === el.dataset.id
        );

        closeModal();

        if (session) {
          sessionFormModal(session);
        }

        return;
      }

      if (action === "open-session") {
        sessionActionsModal(el.dataset.id);
        return;
      }

      if (action === "complete-session") {
        const session = data.sessions.find(
          s => s.id === el.dataset.id
        );

        if (session) {
          session.status = "completed";
          saveData();
        }

        closeModal();
        render();
        return;
      }

      if (action === "cancel-session") {
        const session = data.sessions.find(
          s => s.id === el.dataset.id
        );

        if (session) {
          session.status = "cancelled";
          saveData();
        }

        closeModal();
        render();
        return;
      }

      if (action === "delete-session") {
        if (!confirm("Delete this session?")) return;

        data.sessions = data.sessions.filter(
          s => s.id !== el.dataset.id
        );

        saveData();
        closeModal();
        render();
        return;
      }

      if (action === "add-payment") {
        closeModal();
        paymentFormModal(el.dataset.student || null);
        return;
      }

      if (action === "add-note") {
        closeModal();
        noteFormModal(el.dataset.student);
        return;
      }

      if (action === "delete-student") {
        const student = studentById(el.dataset.id);

        if (!student) return;

        if (
          !confirm(
            `Delete ${student.name}? This will also remove their sessions and payments.`
          )
        ) {
          return;
        }

        data.students = data.students.filter(
          s => s.id !== student.id
        );

        data.sessions = data.sessions.filter(
          s => s.studentId !== student.id
        );

        data.payments = data.payments.filter(
          p => p.studentId !== student.id
        );

        saveData();

        view = "students";
        openStudentId = null;

        render();
        return;
      }

      if (action === "prev-week") {
        weekOffset--;
        render();
        return;
      }

      if (action === "next-week") {
        weekOffset++;
        render();
        return;
      }
    }

    /* ==================================================
       HTML SAFETY
    ================================================== */

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHTML(value);
    }

    /* ==================================================
       START
    ================================================== */

    loadData();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .catch(error => {
            console.warn("Service worker registration failed:", error);
          });
      });
    }
  </script>
</body>
</html>
