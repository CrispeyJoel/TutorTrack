<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
  />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ledger" />

  <meta name="theme-color" content="#F5F5F2" />
  <meta
    name="description"
    content="A simple teaching schedule, student and payment manager."
  />

  <title>Ledger</title>

  <link rel="manifest" href="manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #f5f5f2;
      --card: #ffffff;
      --card-soft: #eeeee9;
      --ink: #171914;
      --muted: #777870;
      --line: #e1e1db;

      --green: #2f7a5e;
      --blue: #2b5fad;
      --purple: #7a4fb5;
      --gold: #b8862e;
      --orange: #c4542d;
      --red: #a33d3d;

      --radius: 18px;
      --nav-height: 76px;

      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 13px;
      padding: 13px 14px;
      outline: none;
      font-size: 15px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #aaa9a1;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      position: relative;
      padding-bottom: calc(var(--nav-height) + 22px + var(--safe-bottom));
    }

    /* --------------------------------------------------
       HEADER
    -------------------------------------------------- */

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding:
        calc(16px + var(--safe-top))
        20px
        15px;
      background: rgba(245, 245, 242, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(225, 225, 219, 0.65);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-family: "Newsreader", serif;
      font-size: 31px;
      line-height: 1;
      letter-spacing: -0.03em;
      font-weight: 500;
    }

    .header-title {
      font-family: "Newsreader", serif;
      font-size: 29px;
      line-height: 1;
      letter-spacing: -0.025em;
      font-weight: 500;
    }

    .header-date {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .header-action {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
    }

    .header-action:active {
      transform: scale(0.94);
      opacity: 0.85;
    }

    .back-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-button svg {
      width: 18px;
      height: 18px;
    }

    /* --------------------------------------------------
       CONTENT
    -------------------------------------------------- */

    .app-content {
      padding: 22px 18px 0;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: "Newsreader", serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.015em;
    }

    .section-link {
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      padding: 5px;
    }

    /* --------------------------------------------------
       HERO
    -------------------------------------------------- */

    .today-hero {
      padding: 6px 2px 24px;
    }

    .eyebrow {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .hero-title {
      font-family: "Newsreader", serif;
      font-size: 38px;
      line-height: 1.02;
      font-weight: 500;
      letter-spacing: -0.035em;
      max-width: 340px;
    }

    .hero-subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
    }

    /* --------------------------------------------------
       STAT CARDS
    -------------------------------------------------- */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 15px 12px;
      min-height: 95px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-label {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
    }

    .stat-value {
      font-family: "Newsreader", serif;
      font-size: 25px;
      line-height: 1;
      letter-spacing: -0.025em;
    }

    /* --------------------------------------------------
       CARDS
    -------------------------------------------------- */

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .session-card {
      position: relative;
      overflow: hidden;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 13px;
      transition: transform 0.15s;
    }

    .session-card:active {
      transform: scale(0.985);
    }

    .session-color {
      width: 4px;
      align-self: stretch;
      min-height: 57px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .session-main {
      flex: 1;
      min-width: 0;
    }

    .session-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-subject {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .session-right {
      text-align: right;
      flex-shrink: 0;
    }

    .session-time {
      font-size: 14px;
      font-weight: 600;
    }

    .session-duration {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-done {
      background: #e5efe9;
      color: var(--green);
    }

    .status-cancelled {
      background: #f3e4e4;
      color: var(--red);
    }

    /* --------------------------------------------------
       BUTTONS
    -------------------------------------------------- */

    .primary-button {
      width: 100%;
      min-height: 50px;
      border-radius: 14px;
      background: var(--ink);
      color: white;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.15s, opacity 0.15s;
    }

    .primary-button:active {
      transform: scale(0.985);
      opacity: 0.9;
    }

    .secondary-button {
      min-height: 46px;
      padding: 0 17px;
      border-radius: 13px;
      background: var(--card-soft);
      color: var(--ink);
      font-weight: 600;
      font-size: 13px;
    }

    .danger-button {
      width: 100%;
      min-height: 48px;
      border-radius: 13px;
      background: #f3e4e4;
      color: var(--red);
      font-weight: 600;
    }

    .small-button {
      min-height: 38px;
      padding: 0 13px;
      border-radius: 11px;
      background: var(--ink);
      color: white;
      font-size: 12px;
      font-weight: 600;
    }

    .button-row {
      display: flex;
      gap: 9px;
    }

    .button-row > * {
      flex: 1;
    }

    /* --------------------------------------------------
       EMPTY STATES
    -------------------------------------------------- */

    .empty-state {
      padding: 34px 20px;
      text-align: center;
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    .empty-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--card-soft);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon svg {
      width: 19px;
      height: 19px;
      color: var(--muted);
    }

    .empty-title {
      font-family: "Newsreader", serif;
      font-size: 21px;
    }

    .empty-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 5px;
    }

    /* --------------------------------------------------
       SCHEDULE
    -------------------------------------------------- */

    .week-card {
      background: var(--ink);
      color: white;
      border-radius: 20px;
      padding: 17px;
      margin-bottom: 23px;
    }

    .week-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .week-label {
      font-family: "Newsreader", serif;
      font-size: 22px;
    }

    .week-buttons {
      display: flex;
      gap: 7px;
    }

    .week-button {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .week-button svg {
      width: 15px;
      height: 15px;
    }

    .day-block {
      margin-bottom: 25px;
    }

    .day-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 9px;
      padding: 0 3px;
    }

    .day-name {
      font-family: "Newsreader", serif;
      font-size: 20px;
    }

    .day-date {
      color: var(--muted);
      font-size: 11px;
    }

    .today-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      margin-left: 5px;
      vertical-align: middle;
    }

    /* --------------------------------------------------
       STUDENTS
    -------------------------------------------------- */

    .student-card {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px;
      margin-bottom: 9px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      transition: transform 0.15s;
    }

    .student-card:active {
      transform: scale(0.985);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Newsreader", serif;
      font-size: 19px;
      flex-shrink: 0;
    }

    .student-main {
      min-width: 0;
      flex: 1;
    }

    .student-name {
      font-size: 15px;
      font-weight: 600;
    }

    .student-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .balance {
      text-align: right;
      flex-shrink: 0;
    }

    .balance-label {
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .balance-value {
      margin-top: 2px;
      font-size: 14px;
      font-weight: 600;
    }

    .balance-positive {
      color: var(--red);
    }

    .balance-clear {
      color: var(--green);
    }

    /* --------------------------------------------------
       STUDENT DETAIL
    -------------------------------------------------- */

    .profile-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 15px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .profile-avatar {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: var(--ink);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Newsreader", serif;
      font-size: 26px;
    }

    .profile-name {
      font-family: "Newsreader", serif;
      font-size: 29px;
      line-height: 1;
    }

    .profile-detail {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
    }

    .subject-chip {
      padding: 6px 9px;
      border-radius: 20px;
      color: white;
      font-size: 10px;
      font-weight: 600;
    }

    .balance-large {
      margin-top: 18px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: end;
      justify-content: space-between;
    }

    .balance-large-label {
      color: var(--muted);
      font-size: 11px;
    }

    .balance-large-value {
      font-family: "Newsreader", serif;
      font-size: 32px;
    }

    .info-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 10px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-label {
      color: var(--muted);
      font-size: 12px;
    }

    .info-value {
      text-align: right;
      font-size: 13px;
      font-weight: 500;
    }

    .note-card {
      background: #f0eee6;
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 8px;
    }

    .note-date {
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 5px;
    }

    .note-text {
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* --------------------------------------------------
       PAYMENTS
    -------------------------------------------------- */

    .money-card {
      padding: 18px;
      margin-bottom: 9px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .money-name {
      font-weight: 600;
      font-size: 14px;
    }

    .money-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .money-amount {
      font-family: "Newsreader", serif;
      font-size: 23px;
      color: var(--red);
    }

    .payment-history-card {
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .payment-date {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .payment-amount {
      color: var(--green);
      font-weight: 600;
    }

    /* --------------------------------------------------
       FORM
    -------------------------------------------------- */

    .field {
      margin-bottom: 15px;
    }

    .field-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .subject-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .subject-option {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: white;
      text-align: left;
      font-size: 13px;
      transition: border-color 0.15s, background 0.15s;
    }

    .subject-option.selected {
      border-color: var(--ink);
      background: var(--card-soft);
      font-weight: 600;
    }

    /* --------------------------------------------------
       BOTTOM NAV
    -------------------------------------------------- */

    .bottom-nav {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(480px, 100%);
      padding: 8px 12px calc(8px + var(--safe-bottom));
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--line);
    }

    .bottom-nav-inner {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
    }

    .nav-item {
      height: 54px;
      border-radius: 15px;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.8;
    }

    .nav-item.active {
      background: var(--ink);
      color: white;
    }

    /* --------------------------------------------------
       FAB
    -------------------------------------------------- */

    .fab {
      position: fixed;
      z-index: 25;
      right: max(20px, calc((100vw - 480px) / 2 + 20px));
      bottom: calc(92px + var(--safe-bottom));
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--ink);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
      transition: transform 0.15s;
    }

    .fab:active {
      transform: scale(0.92);
    }

    .fab svg {
      width: 21px;
      height: 21px;
    }

    /* --------------------------------------------------
       MODALS
    -------------------------------------------------- */

    #modal-root {
      position: relative;
      z-index: 100;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.36);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn 0.18s ease;
    }

    .modal-sheet {
      width: min(480px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: var(--bg);
      border-radius: 25px 25px 0 0;
      padding: 10px 20px calc(22px + var(--safe-bottom));
      animation: slideUp 0.22s ease;
    }

    .modal-handle {
      width: 38px;
      height: 4px;
      border-radius: 5px;
      background: #c9c9c2;
      margin: 4px auto 20px;
    }

    .modal-title {
      font-family: "Newsreader", serif;
      font-size: 28px;
      margin-bottom: 20px;
      letter-spacing: -0.025em;
    }

    .modal-close {
      position: absolute;
      right: 17px;
      top: 15px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close svg {
      width: 16px;
      height: 16px;
    }

    .modal-content {
      position: relative;
    }

    /* --------------------------------------------------
       QUICK ACTIONS
    -------------------------------------------------- */

    .action-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-button {
      min-height: 52px;
      padding: 0 15px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      text-align: left;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .action-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--card-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-icon svg {
      width: 16px;
      height: 16px;
    }

    /* --------------------------------------------------
       ANIMATIONS
    -------------------------------------------------- */

    .fade-enter {
      animation: fadeUp 0.2s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    /* --------------------------------------------------
       DESKTOP
    -------------------------------------------------- */

    @media (min-width: 600px) {
      body {
        background: #e9e9e4;
      }

      #app {
        background: var(--bg);
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.08);
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="modal-root"></div>

<script>
/* ============================= DATA ============================= */
const SUBJECTS = {
  Maths:      '#2B5FAD',
  Physics:    '#7A4FB5',
  English:    '#B8862E',
  Piano:      '#2F7A5E',
  Percussion: '#C4542D',
  Other:      '#6B6B63',
};
const SUBJECT_NAMES = Object.keys(SUBJECTS);

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

let state = { students: [], sessions: [], payments: [] };
let loaded = false;
let view = 'today';
let weekOffset = 0;
let openStudentId = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

const STORAGE_KEY = 'ledger-data';
async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ /* no data yet */ }
  loaded = true;
  render();
}

let saveTimer = null;
function saveData(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('save failed', e); }
  }, 120);
}

/* ============================= HELPERS ============================= */
function fmtMoney(n){ const v = Math.round((n + Number.EPSILON) * 100) / 100; return (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2); }
function pad(n){ return n.toString().padStart(2,'0'); }
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function isoToDate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function dateToISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(iso, n){ const d = isoToDate(iso); d.setDate(d.getDate()+n); return dateToISO(d); }
function dayLabel(iso, opts){ opts = opts || {}; const d = isoToDate(iso);
  const weekday = d.toLocaleDateString('en-AU', { weekday: opts.short ? 'short' : 'long' });
  const md = d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
  return { weekday, md };
}
function time12(t){ if(!t) return ''; let [h,m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12; if(h===0) h = 12; return h + (m ? ':' + pad(m) : '') + ap; }
function startOfWeek(iso){ const d = isoToDate(iso); const dow = d.getDay(); const diff = (dow === 0 ? -6 : 1) - dow; d.setDate(d.getDate() + diff); return dateToISO(d); }
function studentById(id){ return state.students.find(s => s.id === id); }
function subjectColor(name){ return SUBJECTS[name] || SUBJECTS.Other; }

function sessionCost(session){
  const st = studentById(session.studentId);
  if(!st) return 0;
  if(st.rateType === 'hour') return (st.rate || 0) * (session.duration || 0) / 60;
  return st.rate || 0;
}
function studentBalance(studentId){
  const earned = state.sessions.filter(s => s.studentId === studentId && s.status === 'completed').reduce((sum,s) => sum + sessionCost(s), 0);
  const paid = state.payments.filter(p => p.studentId === studentId).reduce((sum,p) => sum + p.amount, 0);
  return earned - paid;
}
function totalOutstanding(){ return state.students.reduce((sum,s) => sum + Math.max(0, studentBalance(s.id)), 0); }
function hoursThisWeek(){
  const start = startOfWeek(todayISO());
  const end = addDays(start, 6);
  return state.sessions.filter(s => s.date >= start && s.date <= end && s.status !== 'cancelled')
    .reduce((sum,s) => sum + (s.duration||0), 0) / 60;
}

/* ============================= RENDER SHELL ============================= */
function render(){
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = ''; return; }
  const body = view === 'student' ? renderStudentDetail(openStudentId)
    : view === 'schedule' ? renderSchedule()
    : view === 'students' ? renderStudents()
    : view === 'payments' ? renderPayments()
    : renderToday();

  app.innerHTML = `
    ${renderHeader()}
    <div class="flex-1 px-5 pt-5 fade-enter">${body}</div>
    ${renderTabBar()}
  `;
}

function renderHeader(){
  if(view === 'student'){
    const s = studentById(openStudentId);
    if(!s) { view = 'students'; return renderHeader(); }
    return `
      <div class="sticky top-0 z-10 px-5 pt-6 pb-4 flex items-center gap-3" style="background: var(--paper);">
        <button data-action="back-students" class="press text-[15px]" style="color: var(--ink-soft);">&larr; Students</button>
      </div>`;
  }
  const titles = { today: 'Today', schedule: 'Schedule', students: 'Students', payments: 'Payments' };
  const d = new Date();
  const dateStr = d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
  return `
    <div class="sticky top-0 z-10 px-5 pt-7 pb-3 flex items-end justify-between" style="background: var(--paper);">
      <div>
        <div class="flex items-center gap-2">
          ${view === 'today' ? `<svg width="18" height="18" viewBox="0 0 100 100" fill="none" aria-hidden="true">
            <rect width="100" height="100" rx="22" fill="var(--ink)"/>
            <rect x="24" y="30" width="38" height="12" rx="6" fill="var(--paper)"/>
            <rect x="24" y="49" width="30" height="12" rx="6" fill="var(--paper)"/>
            <rect x="24" y="68" width="20" height="12" rx="6" fill="var(--paper)"/>
          </svg>` : ''}
          <h1 class="serif text-[28px] leading-none" style="color: var(--ink);">${titles[view]}</h1>
        </div>
        ${view === 'today' ? `<p class="text-[13px] mt-1.5" style="color: var(--ink-soft);">${dateStr}</p>` : ''}
      </div>
    </div>`;
}

function renderTabBar(){
  const tabs = [
    { id: 'today', label: 'Today' },
    { id: 'schedule', label: 'Schedule' },
    { id: 'students', label: 'Students' },
    { id: 'payments', label: 'Payments' },
  ];
  const active = view === 'student' ? 'students' : view;
  return `
    <div class="fixed bottom-0 left-0 right-0 z-20">
      <div class="max-w-md mx-auto flex border-t" style="background: var(--paper-raised); border-color: var(--hairline);">
        ${tabs.map(t => `
          <button data-action="nav" data-view="${t.id}" class="press flex-1 py-3.5 text-center text-[13px]"
            style="color: ${active === t.id ? 'var(--ink)' : 'var(--ink-soft)'}; font-weight: ${active === t.id ? '600' : '400'};">
            ${t.label}
          </button>`).join('')}
      </div>
    </div>`;
}

/* ============================= TODAY ============================= */
function renderToday(){
  const today = todayISO();
  const sessions = state.sessions.filter(s => s.date === today).sort((a,b) => a.time.localeCompare(b.time));
  const outstanding = totalOutstanding();
  const hrs = hoursThisWeek();

  const stats = `
    <div class="grid grid-cols-3 gap-3 mb-7">
      ${statCard(sessions.length, sessions.length === 1 ? 'session today' : 'sessions today')}
      ${statCard(hrs.toFixed(1), 'hrs this week')}
      ${statCard(fmtMoney(outstanding), 'owed to you', outstanding > 0 ? 'var(--danger)' : 'var(--ink)')}
    </div>`;

  const list = sessions.length === 0
    ? emptyState('Nothing scheduled today', 'Add a session to get your day on the ledger.', 'add-session')
    : `<div class="space-y-2.5">${sessions.map(sessionRow).join('')}</div>`;

  return `
    ${stats}
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-[13px]" style="color: var(--ink-soft);">Today's sessions</h2>
      <button data-action="add-session" class="press text-[13px]" style="color: var(--ink); font-weight: 600;">+ Add session</button>
    </div>
    ${list}
  `;
}

function statCard(value, label, color){
  return `
    <div class="rounded-xl p-3.5 border" style="background: var(--paper-raised); border-color: var(--hairline);">
      <div class="serif text-[22px] tabular leading-none" style="color: ${color || 'var(--ink)'};">${value}</div>
      <div class="text-[11.5px] mt-1.5 leading-tight" style="color: var(--ink-soft);">${label}</div>
    </div>`;
}

function emptyState(title, sub, action){
  return `
    <div class="rounded-xl border border-dashed py-10 px-6 text-center" style="border-color: var(--hairline-strong);">
      <p class="serif text-[17px] mb-1.5">${title}</p>
      <p class="text-[13px] mb-4" style="color: var(--ink-soft);">${sub}</p>
      <button data-action="${action}" class="press text-[13px] px-4 py-2 rounded-full" style="background: var(--ink); color: var(--paper);">+ Add</button>
    </div>`;
}

function sessionRow(s){
  const st = studentById(s.studentId);
  if(!st) return '';
  const color = subjectColor(s.subject);
  const done = s.status === 'completed';
  const cancelled = s.status === 'cancelled';
  return `
    <div data-action="open-session" data-id="${s.id}" class="press rounded-xl border p-3.5 flex items-center gap-3 cursor-pointer"
      style="background: var(--paper-raised); border-color: var(--hairline); opacity: ${cancelled ? '0.55' : '1'};">
      <div class="w-1 self-stretch rounded-full" style="background: ${color};"></div>
      <div class="flex-1 min-w-0">
        <div class="flex items-baseline gap-2">
          <span class="text-[15px] font-medium truncate">${st.name}</span>
          <span class="text-[12px] shrink-0" style="color: var(--ink-soft);">${s.subject}</span>
        </div>
        <div class="text-[12.5px] mt-0.5" style="color: var(--ink-soft);">
          ${time12(s.time)} &middot; ${s.duration}min${cancelled ? ' &middot; cancelled' : ''}
        </div>
      </div>
      ${done ? `<span class="text-[11px] px-2 py-1 rounded-full shrink-0" style="background: var(--piano); color: white;">Done</span>` : ''}
    </div>`;
}

/* ============================= SCHEDULE ============================= */
function renderSchedule(){
  const base = addDays(startOfWeek(todayISO()), weekOffset * 7);
  const days = Array.from({length:7}, (_,i) => addDays(base, i));
  const weekEnd = days[6];
  const label = weekOffset === 0 ? 'This week' : (isoToDate(base).toLocaleDateString('en-AU',{day:'numeric',month:'short'}) + ' – ' + isoToDate(weekEnd).toLocaleDateString('en-AU',{day:'numeric',month:'short'}));

  const rows = days.map(iso => {
    const daySessions = state.sessions.filter(s => s.date === iso).sort((a,b) => a.time.localeCompare(b.time));
    const { weekday, md } = dayLabel(iso, { short: true });
    const isToday = iso === todayISO();
    return `
      <div class="mb-5">
        <div class="flex items-baseline gap-2 mb-2">
          <span class="text-[13px] font-medium" style="color: ${isToday ? 'var(--ink)' : 'var(--ink-soft)'};">${weekday}</span>
          <span class="text-[12px]" style="color: var(--ink-soft);">${md}</span>
          ${isToday ? `<span class="w-1.5 h-1.5 rounded-full" style="background: var(--physics);"></span>` : ''}
        </div>
        ${daySessions.length === 0
          ? `<p class="text-[13px] pl-0.5" style="color: #B4B3A6;">—</p>`
          : `<div class="space-y-2">${daySessions.map(sessionRow).join('')}</div>`}
      </div>`;
  }).join('');

  return `
    <div class="flex items-center justify-between mb-5">
      <button data-action="week-prev" class="press text-[18px] px-2" style="color: var(--ink-soft);">&larr;</button>
      <div class="text-center">
        <div class="text-[14px] font-medium">${label}</div>
      </div>
      <button data-action="week-next" class="press text-[18px] px-2" style="color: var(--ink-soft);">&rarr;</button>
    </div>
    ${rows}
    <button data-action="add-session" class="press w-full text-[13px] py-3 rounded-xl border border-dashed mt-2" style="border-color: var(--hairline-strong); color: var(--ink-soft);">+ Add session</button>
  `;
}

/* ============================= STUDENTS ============================= */
function renderStudents(){
  const students = [...state.students].sort((a,b) => a.name.localeCompare(b.name));
  if(students.length === 0){
    return emptyState('No students yet', 'Add your first student to start tracking lessons and payments.', 'add-student');
  }
  return `
    <div class="space-y-2.5 mb-4">
      ${students.map(s => {
        const bal = studentBalance(s.id);
        return `
        <div data-action="open-student" data-id="${s.id}" class="press rounded-xl border p-3.5 flex items-center gap-3 cursor-pointer"
          style="background: var(--paper-raised); border-color: var(--hairline);">
          <div class="flex-1 min-w-0">
            <div class="text-[15px] font-medium truncate">${s.name}</div>
            <div class="flex flex-wrap gap-1.5 mt-1.5">
              ${s.subjects.map(sub => `<span class="text-[10.5px] px-1.5 py-0.5 rounded" style="background: ${hexToRgba(subjectColor(sub),0.1)}; color: ${subjectColor(sub)};">${sub}</span>`).join('')}
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-[14px] tabular font-medium" style="color: ${bal > 0 ? 'var(--danger)' : 'var(--ink-soft)'};">${fmtMoney(Math.max(bal,0))}</div>
            <div class="text-[10.5px]" style="color: var(--ink-soft);">${bal > 0 ? 'owed' : 'settled'}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <button data-action="add-student" class="press w-full text-[13px] py-3 rounded-xl border border-dashed" style="border-color: var(--hairline-strong); color: var(--ink-soft);">+ Add student</button>
  `;
}

function renderStudentDetail(id){
  const s = studentById(id);
  if(!s) return '';
  const sessions = state.sessions.filter(x => x.studentId === id).sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));
  const payments = state.payments.filter(x => x.studentId === id).sort((a,b) => b.date.localeCompare(a.date));
  const bal = studentBalance(id);
  const notes = s.generalNotes || [];

  return `
    <div class="mb-6">
      <h2 class="serif text-[26px] leading-none mb-1">${s.name}</h2>
      <div class="flex flex-wrap gap-1.5 mt-2 mb-3">
        ${s.subjects.map(sub => `<span class="text-[11px] px-2 py-0.5 rounded" style="background: ${hexToRgba(subjectColor(sub),0.1)}; color: ${subjectColor(sub)};">${sub}</span>`).join('')}
      </div>
      <p class="text-[13px]" style="color: var(--ink-soft);">
        ${s.rateType === 'hour' ? fmtMoney(s.rate) + '/hr' : fmtMoney(s.rate) + '/session'}${s.phone ? ' &middot; ' + s.phone : ''}
      </p>
      <div class="flex gap-2 mt-4">
        <button data-action="edit-student" data-id="${s.id}" class="press flex-1 text-[13px] py-2.5 rounded-lg border" style="border-color: var(--hairline-strong); color: var(--ink);">Edit details</button>
        <button data-action="log-payment" data-id="${s.id}" class="press flex-1 text-[13px] py-2.5 rounded-lg" style="background: var(--ink); color: var(--paper);">Log payment</button>
      </div>
    </div>

    <div class="rounded-xl border p-4 mb-6 flex items-center justify-between" style="background: var(--paper-raised); border-color: var(--hairline);">
      <span class="text-[13px]" style="color: var(--ink-soft);">Balance</span>
      <span class="serif text-[20px] tabular" style="color: ${bal > 0 ? 'var(--danger)' : 'var(--ink)'};">${fmtMoney(bal)}</span>
    </div>

    <div class="mb-6">
      <div class="flex items-center justify-between mb-2.5">
        <h3 class="text-[13px]" style="color: var(--ink-soft);">Notes</h3>
        <button data-action="add-note" data-id="${s.id}" class="press text-[13px] font-medium">+ Add note</button>
      </div>
      ${notes.length === 0 ? `<p class="text-[13px]" style="color: #B4B3A6;">No notes yet.</p>` :
        `<div class="space-y-2">${notes.slice().reverse().map(n => `
          <div class="rounded-lg border p-3" style="border-color: var(--hairline);">
            <p class="text-[13.5px] leading-snug">${escapeHtml(n.text)}</p>
            <p class="text-[11px] mt-1.5" style="color: var(--ink-soft);">${isoToDate(n.date).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}</p>
          </div>`).join('')}</div>`}
    </div>

    <div class="mb-6">
      <h3 class="text-[13px] mb-2.5" style="color: var(--ink-soft);">Session history</h3>
      ${sessions.length === 0 ? `<p class="text-[13px]" style="color: #B4B3A6;">No sessions logged yet.</p>` :
        `<div class="space-y-2">${sessions.map(sessionRow).join('')}</div>`}
    </div>

    <div class="mb-2">
      <h3 class="text-[13px] mb-2.5" style="color: var(--ink-soft);">Payment history</h3>
      ${payments.length === 0 ? `<p class="text-[13px]" style="color: #B4B3A6;">No payments logged yet.</p>` :
        `<div class="space-y-2">${payments.map(p => `
          <div class="rounded-lg border p-3 flex items-center justify-between" style="border-color: var(--hairline);">
            <div>
              <div class="text-[13.5px]">${p.method || 'Payment'}</div>
              <div class="text-[11px]" style="color: var(--ink-soft);">${isoToDate(p.date).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}${p.note ? ' &middot; ' + escapeHtml(p.note) : ''}</div>
            </div>
            <div class="text-[14px] tabular font-medium">${fmtMoney(p.amount)}</div>
          </div>`).join('')}</div>`}
    </div>
  `;
}

/* ============================= PAYMENTS ============================= */
function renderPayments(){
  const owing = state.students.map(s => ({ s, bal: studentBalance(s.id) })).filter(x => x.bal > 0.004).sort((a,b) => b.bal - a.bal);
  const allPayments = [...state.payments].sort((a,b) => b.date.localeCompare(a.date));

  const owingBlock = owing.length === 0 ? '' : `
    <div class="mb-6">
      <h2 class="text-[13px] mb-2.5" style="color: var(--ink-soft);">Outstanding</h2>
      <div class="space-y-2">
        ${owing.map(({s,bal}) => `
          <div data-action="open-student" data-id="${s.id}" class="press rounded-xl border p-3.5 flex items-center justify-between cursor-pointer" style="background: var(--paper-raised); border-color: var(--hairline);">
            <span class="text-[14.5px]">${s.name}</span>
            <span class="text-[14px] tabular font-medium" style="color: var(--danger);">${fmtMoney(bal)}</span>
          </div>`).join('')}
      </div>
    </div>`;

  const historyBlock = allPayments.length === 0
    ? emptyState('No payments logged', 'Log a payment as it comes in to keep balances current.', 'log-payment')
    : `
      <h2 class="text-[13px] mb-2.5" style="color: var(--ink-soft);">History</h2>
      <div class="space-y-2">
        ${allPayments.map(p => {
          const s = studentById(p.studentId);
          return `
          <div class="rounded-lg border p-3.5 flex items-center justify-between" style="border-color: var(--hairline);">
            <div>
              <div class="text-[14px]">${s ? s.name : 'Unknown'}</div>
              <div class="text-[11.5px] mt-0.5" style="color: var(--ink-soft);">${isoToDate(p.date).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}${p.method ? ' &middot; ' + p.method : ''}</div>
            </div>
            <div class="text-[14.5px] tabular font-medium">${fmtMoney(p.amount)}</div>
          </div>`;
        }).join('')}
      </div>`;

  return `
    ${owingBlock}
    ${historyBlock}
    ${allPayments.length > 0 ? `<button data-action="log-payment" class="press w-full text-[13px] py-3 rounded-xl border border-dashed mt-4" style="border-color: var(--hairline-strong); color: var(--ink-soft);">+ Log payment</button>` : ''}
  `;
}

function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

/* ============================= MODALS ============================= */
function openModal(html){
  document.getElementById('modal-root').innerHTML = `
    <div data-action="modal-backdrop" class="fixed inset-0 z-30 flex items-end fade-enter" style="background: rgba(28,35,33,0.4);">
      <div class="modal-enter w-full max-w-md mx-auto rounded-t-2xl max-h-[88vh] overflow-y-auto" style="background: var(--paper);">
        ${html}
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function modalShell(title, bodyHtml, footerHtml){
  return `
    <div class="px-5 pt-5 pb-3 flex items-center justify-between sticky top-0" style="background: var(--paper);">
      <h2 class="serif text-[19px]">${title}</h2>
      <button data-action="modal-close" class="press text-[20px] leading-none px-1" style="color: var(--ink-soft);">&times;</button>
    </div>
    <div class="px-5 pb-6">${bodyHtml}</div>
    ${footerHtml || ''}
  `;
}
function field(label, inputHtml){
  return `<div class="mb-4"><label class="block text-[12.5px] mb-1.5" style="color: var(--ink-soft);">${label}</label>${inputHtml}</div>`;
}
const inputCls = "w-full rounded-lg px-3 py-2.5 text-[15px]";

/* ---- Add / Edit Student ---- */
function studentFormModal(existing){
  const s = existing || { name:'', subjects:[], rate:'', rateType:'hour', phone:'' };
  openModal(modalShell(existing ? 'Edit student' : 'Add student', `
    <form id="student-form">
      ${field('Name', `<input required name="name" class="${inputCls}" value="${s.name}" placeholder="Student name" />`)}
      ${field('Subjects', `
        <div class="flex flex-wrap gap-2">
          ${SUBJECT_NAMES.map(sub => {
            const isChecked = s.subjects.includes(sub);
            return `
            <label class="press text-[12.5px] px-2.5 py-1.5 rounded-full border cursor-pointer select-none subject-check"
              style="border-color: ${isChecked ? subjectColor(sub) : 'var(--hairline-strong)'}; color: ${isChecked ? subjectColor(sub) : 'var(--ink-soft)'};">
              <input type="checkbox" name="subjects" value="${sub}" class="hidden" ${isChecked ? 'checked' : ''}/>${sub}
            </label>`;
          }).join('')}
        </div>`)}
      <div class="grid grid-cols-2 gap-3">
        ${field('Rate', `<input required name="rate" type="number" step="0.01" min="0" class="${inputCls}" value="${s.rate}" placeholder="0.00" />`)}
        ${field('Per', `
          <select name="rateType" class="${inputCls}">
            <option value="hour" ${s.rateType==='hour'?'selected':''}>Hour</option>
            <option value="session" ${s.rateType==='session'?'selected':''}>Session</option>
          </select>`)}
      </div>
      ${field('Phone / contact <span style="color:#B4B3A6;">(optional)</span>', `<input name="phone" class="${inputCls}" value="${s.phone||''}" placeholder="04xx xxx xxx" />`)}
      <button type="submit" class="press w-full py-3 rounded-lg text-[14px] font-medium mt-2" style="background: var(--ink); color: var(--paper);">${existing ? 'Save changes' : 'Add student'}</button>
      ${existing ? `<button type="button" data-action="delete-student" data-id="${existing.id}" class="press w-full py-3 rounded-lg text-[13.5px] mt-2" style="color: var(--danger);">Delete student</button>` : ''}
    </form>
  `));

  document.querySelectorAll('.subject-check input').forEach(input => {
    input.addEventListener('change', (e) => {
      const label = e.target.closest('label');
      const sub = e.target.value;
      const checked = e.target.checked;
      label.style.borderColor = checked ? subjectColor(sub) : 'var(--hairline-strong)';
      label.style.color = checked ? subjectColor(sub) : 'var(--ink-soft)';
    });
  });

  document.getElementById('student-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const subjects = fd.getAll('subjects');
    if(subjects.length === 0){ alert('Pick at least one subject.'); return; }
    const data = { name: fd.get('name').trim(), subjects, rate: parseFloat(fd.get('rate')) || 0, rateType: fd.get('rateType'), phone: fd.get('phone').trim() };
    if(existing){
      Object.assign(existing, data);
    } else {
      state.students.push({ id: uid(), generalNotes: [], ...data });
    }
    saveData(); closeModal(); render();
  });
}

/* ---- Add Session ---- */
function sessionFormModal(existing){
  if(state.students.length === 0){ studentFormModal(null); return; }
  const s = existing || { studentId: state.students[0].id, date: todayISO(), time: '15:00', duration: 60, subject: state.students[0].subjects[0], status: 'scheduled' };
  openModal(modalShell(existing ? 'Edit session' : 'Add session', `
    <form id="session-form">
      ${field('Student', `
        <select name="studentId" id="sess-student" class="${inputCls}">
          ${state.students.map(st => `<option value="${st.id}" ${s.studentId===st.id?'selected':''}>${st.name}</option>`).join('')}
        </select>`)}
      ${field('Subject', `
        <select name="subject" id="sess-subject" class="${inputCls}"></select>`)}
      <div class="grid grid-cols-2 gap-3">
        ${field('Date', `<input required name="date" type="date" class="${inputCls}" value="${s.date}" />`)}
        ${field('Time', `<input required name="time" type="time" class="${inputCls}" value="${s.time}" />`)}
      </div>
      ${field('Duration (minutes)', `<input required name="duration" type="number" min="5" step="5" class="${inputCls}" value="${s.duration}" />`)}
      <button type="submit" class="press w-full py-3 rounded-lg text-[14px] font-medium mt-2" style="background: var(--ink); color: var(--paper);">${existing ? 'Save changes' : 'Add session'}</button>
    </form>
  `));

  function populateSubjects(){
    const st = studentById(document.getElementById('sess-student').value);
    const sel = document.getElementById('sess-subject');
    sel.innerHTML = (st ? st.subjects : SUBJECT_NAMES).map(sub => `<option value="${sub}" ${sub===s.subject?'selected':''}>${sub}</option>`).join('');
  }
  populateSubjects();
  document.getElementById('sess-student').addEventListener('change', populateSubjects);

  document.getElementById('session-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = { studentId: fd.get('studentId'), subject: fd.get('subject'), date: fd.get('date'), time: fd.get('time'), duration: parseInt(fd.get('duration'),10) };
    if(existing){ Object.assign(existing, data); }
    else { state.sessions.push({ id: uid(), status: 'scheduled', note: '', ...data }); }
    saveData(); closeModal(); render();
  });
}

/* ---- Session Quick Actions ---- */
function sessionActionsModal(session){
  const st = studentById(session.studentId);
  openModal(modalShell(st ? st.name : 'Session', `
    <p class="text-[13.5px] mb-4" style="color: var(--ink-soft);">${session.subject} &middot; ${time12(session.time)} &middot; ${session.duration}min</p>
    <div class="grid grid-cols-2 gap-2.5 mb-4">
      <button data-action="mark-session" data-status="completed" data-id="${session.id}" class="press py-2.5 rounded-lg text-[13.5px]" style="background: var(--piano); color: white;">Mark completed</button>
      <button data-action="mark-session" data-status="cancelled" data-id="${session.id}" class="press py-2.5 rounded-lg text-[13.5px] border" style="border-color: var(--hairline-strong);">Mark cancelled</button>
    </div>
    ${field('Note', `<textarea name="note" id="session-note-input" rows="2" class="${inputCls}" placeholder="What did you cover?">${session.note||''}</textarea>`)}
    <button data-action="save-session-note" data-id="${session.id}" class="press w-full py-2.5 rounded-lg text-[13.5px] border mb-2" style="border-color: var(--hairline-strong);">Save note</button>
    <div class="flex gap-2 mt-3">
      <button data-action="edit-session" data-id="${session.id}" class="press flex-1 py-2.5 rounded-lg text-[13.5px]" style="background: var(--ink); color: var(--paper);">Edit</button>
      <button data-action="delete-session" data-id="${session.id}" class="press flex-1 py-2.5 rounded-lg text-[13.5px]" style="color: var(--danger);">Delete</button>
    </div>
  `));
}

/* ---- Log Payment ---- */
function paymentFormModal(studentId){
  if(state.students.length === 0){ studentFormModal(null); return; }
  const initial = studentId || state.students[0].id;
  const bal = Math.max(0, studentBalance(initial));
  openModal(modalShell('Log payment', `
    <form id="payment-form">
      ${field('Student', `
        <select name="studentId" id="pay-student" class="${inputCls}">
          ${state.students.map(st => `<option value="${st.id}" ${st.id===initial?'selected':''}>${st.name}</option>`).join('')}
        </select>`)}
      ${field('Amount', `<input required id="pay-amount" name="amount" type="number" step="0.01" min="0" class="${inputCls}" value="${bal > 0 ? bal.toFixed(2) : ''}" placeholder="0.00" />`)}
      ${field('Date', `<input required name="date" type="date" class="${inputCls}" value="${todayISO()}" />`)}
      ${field('Method <span style="color:#B4B3A6;">(optional)</span>', `
        <select name="method" class="${inputCls}">
          <option value="">Not specified</option>
          <option>Bank transfer</option>
          <option>Cash</option>
          <option>Card</option>
          <option>Other</option>
        </select>`)}
      ${field('Note <span style="color:#B4B3A6;">(optional)</span>', `<input name="note" class="${inputCls}" placeholder="e.g. covers last 3 sessions" />`)}
      <button type="submit" class="press w-full py-3 rounded-lg text-[14px] font-medium mt-2" style="background: var(--ink); color: var(--paper);">Log payment</button>
    </form>
  `));

  document.getElementById('pay-student').addEventListener('change', (e) => {
    const b = Math.max(0, studentBalance(e.target.value));
    document.getElementById('pay-amount').value = b > 0 ? b.toFixed(2) : '';
  });

  document.getElementById('payment-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    state.payments.push({ id: uid(), studentId: fd.get('studentId'), amount: parseFloat(fd.get('amount'))||0, date: fd.get('date'), method: fd.get('method'), note: fd.get('note').trim() });
    saveData(); closeModal(); render();
  });
}

/* ---- Add Note ---- */
function noteFormModal(studentId){
  const s = studentById(studentId);
  if(!s) return;
  openModal(modalShell('Add note', `
    <form id="note-form">
      ${field(s.name, `<textarea required name="text" rows="4" class="${inputCls}" placeholder="Progress, reminders, anything worth remembering..."></textarea>`)}
      <button type="submit" class="press w-full py-3 rounded-lg text-[14px] font-medium mt-2" style="background: var(--ink); color: var(--paper);">Save note</button>
    </form>
  `));

  document.getElementById('note-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    s.generalNotes = s.generalNotes || [];
    s.generalNotes.push({ id: uid(), date: todayISO(), text: fd.get('text').trim() });
    saveData(); closeModal(); render();
  });
}

/* ============================= EVENT DELEGATION ============================= */
// Main App Actions Delegation
document.getElementById('app').addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;

  const action = target.dataset.action;
  const id = target.dataset.id;

  if (action === 'nav') { view = target.dataset.view; weekOffset = 0; render(); }
  else if (action === 'back-students') { view = 'students'; openStudentId = null; render(); }
  else if (action === 'open-student') { openStudentId = id; view = 'student'; render(); }
  else if (action === 'open-session') {
    const sess = state.sessions.find(s => s.id === id);
    if(sess) sessionActionsModal(sess);
  }
  else if (action === 'add-student') { studentFormModal(null); }
  else if (action === 'edit-student') { studentFormModal(studentById(id)); }
  else if (action === 'add-session') { sessionFormModal(null); }
  else if (action === 'log-payment') { paymentFormModal(id); }
  else if (action === 'add-note') { noteFormModal(id); }
  else if (action === 'week-prev') { weekOffset--; render(); }
  else if (action === 'week-next') { weekOffset++; render(); }
});

// Modal Actions Delegation
document.getElementById('modal-root').addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;

  const action = target.dataset.action;
  const id = target.dataset.id;

  if (action === 'modal-close' || action === 'modal-backdrop') {
    if (action === 'modal-backdrop' && e.target !== e.currentTarget) return;
    closeModal();
  }
  else if (action === 'mark-session') {
    const sess = state.sessions.find(s => s.id === id);
    if(sess){ sess.status = target.dataset.status; saveData(); closeModal(); render(); }
  }
  else if (action === 'save-session-note') {
    const sess = state.sessions.find(s => s.id === id);
    const ta = document.getElementById('session-note-input');
    if(sess && ta){ sess.note = ta.value.trim(); saveData(); closeModal(); render(); }
  }
  else if (action === 'edit-session') {
    const sess = state.sessions.find(s => s.id === id);
    if(sess) sessionFormModal(sess);
  }
  else if (action === 'delete-session') {
    if(confirm('Delete this session?')){
      state.sessions = state.sessions.filter(s => s.id !== id);
      saveData(); closeModal(); render();
    }
  }
  else if (action === 'delete-student') {
    if(confirm('Delete this student and all their sessions and payments? This cannot be undone.')){
      state.students = state.students.filter(s => s.id !== id);
      state.sessions = state.sessions.filter(s => s.studentId !== id);
      state.payments = state.payments.filter(p => p.studentId !== id);
      saveData(); closeModal(); view = 'students'; render();
    }
  }
});

loadData();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
  
</body>
