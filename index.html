<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ledger">
  <meta name="theme-color" content="#F1F0EA">
  <meta name="description" content="A quiet ledger for tutoring schedule, students, payments and notes in one place.">
  <title>Ledger Teaching Schedule</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.js"></script>
  <style>
    :root {
      --paper: #F1F0EA;
      --paper-raised: #FBFAF7;
      --ink: #1C2321;
      --ink-soft: #5B6360;
      --hairline: #DBDACF;
      --hairline-strong: #C7C6B9;
      --maths: #2B5FAD;
      --physics: #7A4FB5;
      --english: #B8862E;
      --piano: #2F7A5E;
      --percussion: #C4542D;
      --other: #6B6B63;
      --danger: #A33D3D;
    }
    html, body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .serif { font-family: 'Newsreader', serif; }
    .tabular { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { display: none; }
    .hairline { border-color: var(--hairline); }
    .press:active { transform: scale(0.98); }
    input, textarea, select {
      background: var(--paper-raised);
      border: 1px solid var(--hairline-strong);
      color: var(--ink);
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--ink);
    }
    input::placeholder, textarea::placeholder {
      color: #9A998D;
    }
    .modal-enter { animation: slideUp .22s ease-out; }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    .fade-enter { animation: fadeIn .15s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      .modal-enter, .fade-enter { animation: none; }
    }

    /* === Mobile/PWA layout fixes (minimal changes) === */
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow-x: hidden; }
    body { min-height: 100dvh; }
    #app { width: 100%; min-height: 100dvh; }

    .app-shell {
      width: 100%;
      max-width: 760px;
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
    }
    .app-shell > .flex-1 {
      width: 100%;
      min-width: 0;
      padding-left: clamp(16px, 5vw, 32px);
      padding-right: clamp(16px, 5vw, 32px);
      padding-top: 20px;
    }

    .bottom-nav {
      position: fixed;
      z-index: 20;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      background: rgba(251,250,247,.96);
      border-top: 1px solid var(--hairline);
      padding-bottom: env(safe-area-inset-bottom);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .bottom-nav-inner {
      width: 100%;
      max-width: 760px;
      min-height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: stretch;
    }
    .bottom-nav button {
      flex: 1 1 0;
      min-width: 0;
      min-height: 64px;
      padding: 10px 4px;
      border: 0;
      background: transparent;
      font-size: 13px;
      line-height: 1.2;
    }

    .schedule-list { width: 100%; min-width: 0; }
    .schedule-list > div { width: 100%; min-width: 0; }
    .session-row { width: 100%; min-width: 0; overflow: hidden; }
    .session-row > div { min-width: 0; }

    @media (max-width: 480px) {
      .app-shell > .flex-1 { padding: 16px; }
      .app-shell h1 { font-size: clamp(26px, 8vw, 34px); }
      .app-shell .text-13px { font-size: 14px; }
      .app-shell .p-3, .app-shell .p-3\.5, .app-shell .p-4 { padding: 15px; }
    }
    @media (min-width: 600px) {
      .schedule-list {
        max-height: calc(100dvh - 240px);
        overflow-y: auto;
        scrollbar-width: thin;
      }
    }
    @media (max-width: 380px) {
      .bottom-nav button { font-size: 12px; }
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="app" class="app-shell">
    <div id="modal-root"></div>
  </div>

  <script>
    // DATA
    const SUBJECTS = { Maths: '#2B5FAD', Physics: '#7A4FB5', English: '#B8862E', Piano: '#2F7A5E', Percussion: '#C4542D', Other: '#6B6B63' };
    const SUBJECTNAMES = Object.keys(SUBJECTS);

    function hexToRgba(hex, alpha) {
      const h = hex.replace('#', '');
      const r = parseInt(h.substring(0,2), 16);
      const g = parseInt(h.substring(2,4), 16);
      const b = parseInt(h.substring(4,6), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    let state = { students: [], sessions: [], payments: [] };
    let loaded = false;
    let view = 'today';
    let weekOffset = 0;
    let openStudentId = null;

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    }

    const STORAGEKEY = 'ledger-data';

    async function loadData() {
      try {
        const raw = localStorage.getItem(STORAGEKEY);
        if (raw) state = JSON.parse(raw);
      } catch(e) {
        // no data yet, or storage unavailable
      }
      loaded = true;
      render();
    }

    let saveTimer = null;
    function saveData() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try {
          localStorage.setItem(STORAGEKEY, JSON.stringify(state));
        } catch(e) {
          console.error('save failed', e);
        }
      }, 120);
    }

    // HELPERS
    function fmtMoney(n) {
      const v = Math.round(n * (Number.EPSILON + 100)) / 100;
      return v < 0 ? '-' + Math.abs(v).toFixed(2) : v.toFixed(2);
    }
    function pad(n) { return n.toString().padStart(2, '0'); }
    function todayISO() {
      const d = new Date();
      return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
    }
    function isoToDate(iso) {
      const [y,m,d] = iso.split('-').map(Number);
      return new Date(y, m-1, d);
    }
    function dateToISO(d) {
      return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
    }
    function addDays(iso, n) {
      const d = isoToDate(iso);
      d.setDate(d.getDate() + n);
      return dateToISO(d);
    }
    function dayLabel(iso, opts) {
      opts = opts || {};
      const d = isoToDate(iso);
      const weekday = d.toLocaleDateString('en-AU', { weekday: opts.short ? 'short' : 'long' });
      const md = d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
      return [weekday, md];
    }
    function time12(t) {
      if (!t) return '';
      let [h,m] = t.split(':').map(Number);
      const ap = h >= 12 ? 'pm' : 'am';
      h = h > 12 ? h - 12 : h;
      if (h === 0) h = 12;
      return h + ':' + (m ? pad(m) : '00') + ' ' + ap;
    }
    function startOfWeek(iso) {
      const d = isoToDate(iso);
      const dow = d.getDay();
      const diff = dow === 0 ? -6 : 1 - dow;
      d.setDate(d.getDate() + diff);
      return dateToISO(d);
    }
    function studentById(id) { return state.students.find(s => s.id === id); }
    function subjectColor(name) { return SUBJECTS[name] || SUBJECTS.Other; }

    function sessionCost(session) {
      const st = studentById(session.studentId);
      if (!st) return 0;
      if (st.rateType === 'hour') return st.rate * (session.duration || 0) / 60;
      return st.rate || 0;
    }

    function studentBalance(studentId) {
      const earned = state.sessions
        .filter(s => s.studentId === studentId && s.status === 'completed')
        .reduce((sum,s) => sum + sessionCost(s), 0);
      const paid = state.payments
        .filter(p => p.studentId === studentId)
        .reduce((sum,p) => sum + p.amount, 0);
      return earned - paid;
    }

    function totalOutstanding() {
      return state.students.reduce((sum,s) => sum + Math.max(0, studentBalance(s.id)), 0);
    }

    function hoursThisWeek() {
      const start = startOfWeek(todayISO());
      const end = addDays(start, 6);
      return state.sessions
        .filter(s => s.date >= start && s.date <= end && s.status !== 'cancelled')
        .reduce((sum,s) => sum + (s.duration||0), 0) / 60;
    }

    // RENDER SHELL
    function render() {
      const app = document.getElementById('app');
      if (!loaded) {
        app.innerHTML = '';
        return;
      }
      const body = view === 'student'
        ? renderStudentDetail(openStudentId)
        : view === 'schedule'
          ? renderSchedule()
          : view === 'students'
            ? renderStudents()
            : view === 'payments'
              ? renderPayments()
              : renderToday();

      app.innerHTML = renderHeader() + '<div class="flex-1 px-5 pt-5 fade-enter">' + body + '</div>' + renderTabBar();
      attachHandlers();
    }

    function renderHeader() {
      if (view === 'student') {
        const s = studentById(openStudentId);
        if (!s) { view = 'students'; return renderHeader(); }
        return `
          <div class="sticky top-0 z-10 px-5 pt-6 pb-4 flex items-center gap-3" style="background: var(--paper)">
            <button data-action="back-students" class="press text-15px" style="color: var(--ink-soft)">&larr; Students</button>
          </div>
        `;
      }
      const titles = { today: 'Today', schedule: 'Schedule', students: 'Students', payments: 'Payments' };
      const d = new Date();
      const dateStr = d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
      return `
        <div class="sticky top-0 z-10 px-5 pt-7 pb-3 flex items-end justify-between" style="background: var(--paper)">
          <div>
            <div class="flex items-center gap-2">
              ${view === 'today' ? `
                <svg width="18" height="18" viewBox="0 0 100 100" fill="none" aria-hidden="true">
                  <rect width="100" height="100" rx="22" fill="var(--ink)"/>
                  <rect x="24" y="30" width="38" height="12" rx="6" fill="var(--paper)"/>
                  <rect x="24" y="49" width="30" height="12" rx="6" fill="var(--paper)"/>
                  <rect x="24" y="68" width="20" height="12" rx="6" fill="var(--paper)"/>
                </svg>
              ` : ''}
              <h1 class="serif text-28px leading-none" style="color: var(--ink)">${titles[view]}</h1>
            </div>
            ${view === 'today' ? `<p class="text-13px mt-1.5" style="color: var(--ink-soft)">${dateStr}</p>` : ''}
          </div>
        </div>
      `;
    }

    function renderTabBar() {
      const tabs = [
        { id: 'today', label: 'Today' },
        { id: 'schedule', label: 'Schedule' },
        { id: 'students', label: 'Students' },
        { id: 'payments', label: 'Payments' }
      ];
      const active = view === 'student' ? 'students' : view;
      return `
        <div class="bottom-nav">
          <div class="bottom-nav-inner flex border-t" style="background: var(--paper-raised); border-color: var(--hairline)">
            ${tabs.map(t => `
              <button data-action="nav" data-view="${t.id}" class="press flex-1 py-3.5 text-center text-13px"
                style="color: ${active === t.id ? 'var(--ink)' : 'var(--ink-soft)'}; font-weight: ${active === t.id ? 600 : 400}">
                ${t.label}
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    // TODAY
    function renderToday() {
      const today = todayISO();
      const sessions = state.sessions.filter(s => s.date === today).sort((a,b) => a.time.localeCompare(b.time));
      const outstanding = totalOutstanding();
      const hrs = hoursThisWeek();

      const stats = `
        <div class="grid grid-cols-3 gap-3 mb-7">
          ${statCard(sessions.length, sessions.length === 1 ? 'session today' : 'sessions today')}
          ${statCard(hrs.toFixed(1), 'hrs this week')}
          ${statCard(fmtMoney(outstanding), 'owed to you', outstanding > 0 ? 'var(--danger)' : 'var(--ink)')}
        </div>
      `;

      const list = sessions.length === 0
        ? emptyState('Nothing scheduled today', 'Add a session to get your day on the ledger.', 'add-session')
        : `<div class="space-y-2.5">${sessions.map(sessionRow).join('')}</div>`;

      return `
        ${stats}
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-13px" style="color: var(--ink-soft)">Today's sessions</h2>
          <button data-action="add-session" class="press text-13px" style="color: var(--ink); font-weight: 600">Add session</button>
        </div>
        ${list}
      `;
    }

    function statCard(value, label, color) {
      return `
        <div class="rounded-xl p-3.5 border" style="background: var(--paper-raised); border-color: var(--hairline)">
          <div class="serif text-22px tabular leading-none" style="color: ${color || 'var(--ink)'}">${value}</div>
          <div class="text-11.5px mt-1.5 leading-tight" style="color: var(--ink-soft)">${label}</div>
        </div>
      `;
    }

    function emptyState(title, sub, action) {
      return `
        <div class="rounded-xl border border-dashed py-10 px-6 text-center" style="border-color: var(--hairline-strong)">
          <p class="serif text-17px mb-1.5">${title}</p>
          <p class="text-13px mb-4" style="color: var(--ink-soft)">${sub}</p>
          <button data-action="${action}" class="press text-13px px-4 py-2 rounded-full" style="background: var(--ink); color: var(--paper)">Add</button>
        </div>
      `;
    }

    function sessionRow(s) {
      const st = studentById(s.studentId);
      if (!st) return '';
      const color = subjectColor(s.subject);
      const done = s.status === 'completed';
      const cancelled = s.status === 'cancelled';
      return `
        <div data-action="open-session" data-id="${s.id}" class="session-row press rounded-xl border p-3.5 flex items-center gap-3"
          style="background: var(--paper-raised); border-color: var(--hairline); opacity: ${cancelled ? 0.55 : 1}">
          <div class="w-1 self-stretch rounded-full" style="background: ${color}"></div>
          <div class="flex-1 min-w-0">
            <div class="flex items-baseline gap-2">
              <span class="text-15px font-medium truncate">${st.name}</span>
              <span class="text-12px shrink-0" style="color: var(--ink-soft)">${s.subject}</span>
            </div>
            <div class="text-12.5px mt-0.5" style="color: var(--ink-soft)">
              ${time12(s.time)} &middot; ${s.duration}min${cancelled ? ' &middot; cancelled' : ''}
            </div>
          </div>
          ${done ? `<span class="text-11px px-2 py-1 rounded-full shrink-0" style="background: var(--piano); color: white">Done</span>` : ''}
        </div>
      `;
    }

    // SCHEDULE (week)
    function renderSchedule() {
      const base = addDays(startOfWeek(todayISO()), weekOffset * 7);
      const days = Array.from({ length: 7 }, (_, i) => addDays(base, i));
      const weekEnd = days[6];
      const label = weekOffset === 0
        ? 'This week'
        : `${isoToDate(base).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })} – ${isoToDate(weekEnd).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}`;

      const rows = days.map(iso => {
        const daySessions = state.sessions.filter(s => s.date === iso).sort((a,b) => a.time.localeCompare(b.time));
        const [weekday, md] = dayLabel(iso, { short: true });
        const isToday = iso === todayISO();
        return `
          <div class="mb-5">
            <div class="flex items-baseline gap-2 mb-2">
              <span class="text-13px font-medium" style="color: ${isToday ? 'var(--ink)' : 'var(--ink-soft)'}">${weekday}</span>
              <span class="text-12px" style="color: var(--ink-soft)">${md}</span>
              ${isToday ? `<span class="w-1.5 h-1.5 rounded-full" style="background: var(--physics)"></span>` : ''}
            </div>
            ${daySessions.length === 0
              ? '<p class="text-13px pl-0.5" style="color: #B4B3A6">&mdash;</p>'
              : `<div class="schedule-list space-y-2">${daySessions.map(sessionRow).join('')}</div>`
            }
          </div>
        `;
      }).join('');

      return `
        <div class="flex items-center justify-between mb-5">
          <button data-action="week-prev" class="press text-18px px-2" style="color: var(--ink-soft)">&larr;</button>
          <div class="text-center">
            <div class="text-14px font-medium">${label}</div>
          </div>
          <button data-action="week-next" class="press text-18px px-2" style="color: var(--ink-soft)">&rarr;</button>
        </div>
        <div class="schedule-list">${rows}</div>
        <button data-action="add-session" class="press w-full text-13px py-3 rounded-xl border border-dashed mt-2"
          style="border-color: var(--hairline-strong); color: var(--ink-soft)">Add session</button>
      `;
    }

    // STUDENTS
    function renderStudents() {
      const students = [...state.students].sort((a,b) => a.name.localeCompare(b.name));
      if (students.length === 0) {
        return emptyState('No students yet', 'Add your first student to start tracking lessons and payments.', 'add-student');
      }
      return `
        <div class="space-y-2.5 mb-4">
          ${students.map(s => {
            const bal = studentBalance(s.id);
            return `
              <div data-action="open-student" data-id="${s.id}" class="press rounded-xl border p-3.5 flex items-center gap-3"
                style="background: var(--paper-raised); border-color: var(--hairline)">
                <div class="flex-1 min-w-0">
                  <div class="text-15px font-medium truncate">${s.name}</div>
                  <div class="flex flex-wrap gap-1.5 mt-1.5">
                    ${s.subjects.map(sub => `
                      <span class="text-10.5px px-1.5 py-0.5 rounded"
                        style="background: ${hexToRgba(subjectColor(sub), 0.1)}; color: ${subjectColor(sub)}">${sub}</span>
                    `).join('')}
                  </div>
                </div>
                <div class="text-right shrink-0">
                  <div class="text-14px tabular font-medium" style="color: ${bal > 0 ? 'var(--danger)' : 'var(--ink-soft)'}">${fmtMoney(Math.max(bal,0))}</div>
                  <div class="text-10.5px" style="color: var(--ink-soft)">${bal > 0 ? 'owed' : 'settled'}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
        <button data-action="add-student" class="press w-full text-13px py-3 rounded-xl border border-dashed"
          style="border-color: var(--hairline-strong); color: var(--ink-soft)">Add student</button>
      `;
    }

    function renderStudentDetail(id) {
      const s = studentById(id);
      if (!s) return '';
      const sessions = state.sessions.filter(x => x.studentId === id).sort((a,b) => b.date + b.time.localeCompare(a.date + a.time));
      const payments = state.payments.filter(x => x.studentId === id).sort((a,b) => b.date.localeCompare(a.date));
      const bal = studentBalance(id);
      const notes = s.generalNotes || [];

      return `
        <div class="mb-6">
          <h2 class="serif text-26px leading-none mb-1">${s.name}</h2>
          <div class="flex flex-wrap gap-1.5 mt-2 mb-3">
            ${s.subjects.map(sub => `
              <span class="text-11px px-2 py-0.5 rounded"
                style="background: ${hexToRgba(subjectColor(sub), 0.1)}; color: ${subjectColor(sub)}">${sub}</span>
            `).join('')}
          </div>
          <p class="text-13px" style="color: var(--ink-soft)">
            ${s.rateType === 'hour' ? fmtMoney(s.rate) + '/hr' : fmtMoney(s.rate) + '/session'}
            ${s.phone ? ' &middot; ' + s.phone : ''}
          </p>
          <div class="flex gap-2 mt-4">
            <button data-action="edit-student" data-id="${s.id}" class="press flex-1 text-13px py-2.5 rounded-lg border"
              style="border-color: var(--hairline-strong); color: var(--ink)">Edit details</button>
            <button data-action="log-payment" data-id="${s.id}" class="press flex-1 text-13px py-2.5 rounded-lg"
              style="background: var(--ink); color: var(--paper)">Log payment</button>
          </div>
        </div>

        <div class="rounded-xl border p-4 mb-6 flex items-center justify-between"
          style="background: var(--paper-raised); border-color: var(--hairline)">
          <span class="text-13px" style="color: var(--ink-soft)">Balance</span>
          <span class="serif text-20px tabular" style="color: ${bal > 0 ? 'var(--danger)' : 'var(--ink)'}">${fmtMoney(bal)}</span>
        </div>

        <div class="mb-6">
          <div class="flex items-center justify-between mb-2.5">
            <h3 class="text-13px" style="color: var(--ink-soft)">Notes</h3>
            <button data-action="add-note" data-id="${s.id}" class="press text-13px font-medium">Add note</button>
          </div>
          ${notes.length === 0
            ? '<p class="text-13px" style="color: #B4B3A6">No notes yet.</p>'
            : `<div class="space-y-2">${notes.slice().reverse().map(n => `
                <div class="rounded-lg border p-3" style="border-color: var(--hairline)">
                  <p class="text-13.5px leading-snug">${escapeHtml(n.text)}</p>
                  <p class="text-11px mt-1.5" style="color: var(--ink-soft)">${isoToDate(n.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}</p>
                </div>
              `).join('')}</div>`
          }
        </div>

        <div class="mb-6">
          <h3 class="text-13px mb-2.5" style="color: var(--ink-soft)">Session history</h3>
          ${sessions.length === 0
            ? '<p class="text-13px" style="color: #B4B3A6">No sessions logged yet.</p>'
            : `<div class="schedule-list space-y-2">${sessions.map(sessionRow).join('')}</div>`
          }
        </div>

        <div class="mb-2">
          <h3 class="text-13px mb-2.5" style="color: var(--ink-soft)">Payment history</h3>
          ${payments.length === 0
            ? '<p class="text-13px" style="color: #B4B3A6">No payments logged yet.</p>'
            : `<div class="space-y-2">${payments.map(p => `
                <div class="rounded-lg border p-3 flex items-center justify-between" style="border-color: var(--hairline)">
                  <div>
                    <div class="text-13.5px">${p.method || 'Payment'}</div>
                    <div class="text-11px" style="color: var(--ink-soft)">${isoToDate(p.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}${p.note ? ' &middot; ' + escapeHtml(p.note) : ''}</div>
                  </div>
                  <div class="text-14px tabular font-medium">${fmtMoney(p.amount)}</div>
                </div>
              `).join('')}</div>`
          }
        </div>
      `;
    }

    // PAYMENTS
    function renderPayments() {
      const owing = state.students.map(s => ({ s, bal: studentBalance(s.id) }))
        .filter(x => x.bal > 0.004)
        .sort((a,b) => b.bal - a.bal);

      const allPayments = [...state.payments].sort((a,b) => b.date.localeCompare(a.date));

      const owingBlock = owing.length === 0
        ? ''
        : `
          <div class="mb-6">
            <h2 class="text-13px mb-2.5" style="color: var(--ink-soft)">Outstanding</h2>
            <div class="space-y-2">
              ${owing.map(({s, bal}) => `
                <div data-action="open-student" data-id="${s.id}" class="press rounded-xl border p-3.5 flex items-center justify-between"
                  style="background: var(--paper-raised); border-color: var(--hairline)">
                  <span class="text-14.5px">${s.name}</span>
                  <span class="text-14px tabular font-medium" style="color: var(--danger)">${fmtMoney(bal)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;

      const historyBlock = allPayments.length === 0
        ? emptyState('No payments logged', 'Log a payment as it comes in to keep balances current.', 'log-payment')
        : `
          <h2 class="text-13px mb-2.5" style="color: var(--ink-soft)">History</h2>
          <div class="space-y-2">
            ${allPayments.map(p => {
              const s = studentById(p.studentId);
              return `
                <div class="rounded-lg border p-3.5 flex items-center justify-between" style="border-color: var(--hairline)">
                  <div>
                    <div class="text-14px">${s ? s.name : 'Unknown'}</div>
                    <div class="text-11.5px mt-0.5" style="color: var(--ink-soft)">${isoToDate(p.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}${p.method ? ' &middot; ' + p.method : ''}</div>
                  </div>
                  <div class="text-14.5px tabular font-medium">${fmtMoney(p.amount)}</div>
                </div>
              `;
            }).join('')}
          </div>
        `;

      return `
        ${owingBlock}
        <div class="flex items-center justify-between mb-2.5">
          ${allPayments.length === 0 ? '' : '<h2 class="text-13px" style="color: var(--ink-soft)">History</h2>'}
        </div>
        ${historyBlock}
        ${allPayments.length === 0 ? '' : `<button data-action="log-payment" class="press w-full text-13px py-3 rounded-xl border border-dashed mt-4" style="border-color: var(--hairline-strong); color: var(--ink-soft)">Log payment</button>`}
      `;
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // MODALS
    function openModal(html) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div data-action="modal-backdrop" class="fixed inset-0 z-30 flex items-end fade-enter" style="background: rgba(28,35,33,0.4)">
          <div class="modal-enter w-full max-w-md mx-auto rounded-t-2xl max-h-[88dvh] overflow-y-auto" style="background: var(--paper)">
            ${html}
          </div>
        </div>
      `;
      attachModalHandlers();
    }

    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    function modalShell(title, bodyHtml, footerHtml) {
      return `
        <div class="px-5 pt-5 pb-3 flex items-center justify-between sticky top-0" style="background: var(--paper)">
          <h2 class="serif text-19px">${title}</h2>
          <button data-action="modal-close" class="press text-20px leading-none px-1" style="color: var(--ink-soft)">&times;</button>
        </div>
        <div class="px-5 pb-6">${bodyHtml}</div>
        ${footerHtml || ''}
      `;
    }

    function field(label, inputHtml) {
      return `
        <div class="mb-4">
          <label class="block text-12.5px mb-1.5" style="color: var(--ink-soft)">${label}</label>
          ${inputHtml}
        </div>
      `;
    }

    const inputCls = 'w-full rounded-lg px-3 py-2.5 text-15px';

    // ---- Add / Edit Student ----
    function studentFormModal(existing) {
      const s = existing || { name: '', subjects: [], rate: '', rateType: 'hour', phone: '' };
      openModal(modalShell(
        existing ? 'Edit student' : 'Add student',
        `
          <form id="student-form">
            ${field('Name', `<input required name="name" class="${inputCls}" value="${s.name || ''}" placeholder="Student name">`)}
            ${field('Subjects', `
              <div class="flex flex-wrap gap-2">
                ${SUBJECTNAMES.map(sub => `
                  <label class="press text-12.5px px-2.5 py-1.5 rounded-full border cursor-pointer select-none subject-check"
                    style="border-color: ${s.subjects.includes(sub) ? subjectColor(sub) : 'var(--hairline-strong)'}; color: ${s.subjects.includes(sub) ? subjectColor(sub) : 'var(--ink-soft)'}">
                    <input type="checkbox" name="subjects" value="${sub}" class="hidden" ${s.subjects.includes(sub) ? 'checked' : ''}>
                    ${sub}
                  </label>
                `).join('')}
              </div>
            `)}
            <div class="grid grid-cols-2 gap-3">
              ${field('Rate', `<input required name="rate" type="number" step="0.01" min="0" class="${inputCls}" value="${s.rate || ''}" placeholder="0.00">`)}
              ${field('Per', `
                <select name="rateType" class="${inputCls}">
                  <option value="hour" ${s.rateType === 'hour' ? 'selected' : ''}>Hour</option>
                  <option value="session" ${s.rateType === 'session' ? 'selected' : ''}>Session</option>
                </select>
              `)}
            </div>
            ${field('Phone (optional)', `<input name="phone" class="${inputCls}" value="${s.phone || ''}" placeholder="04xx xxx xxx">`)}
            <button type="submit" class="press w-full py-3 rounded-lg text-14px font-medium mt-2" style="background: var(--ink); color: var(--paper)">
              ${existing ? 'Save changes' : 'Add student'}
            </button>
          </form>
          ${existing ? `
            <button type="button" data-action="delete-student" data-id="${existing.id}"
              class="press w-full py-3 rounded-lg text-13.5px mt-2" style="color: var(--danger)">Delete student</button>
          ` : ''}
        `,
        ''
      ));

      document.querySelectorAll('.subject-check').forEach(label => {
        label.addEventListener('click', () => {
          const cb = label.querySelector('input');
          const sub = cb.value;
          setTimeout(() => {
            const checked = cb.checked;
            label.style.borderColor = checked ? subjectColor(sub) : 'var(--hairline-strong)';
            label.style.color = checked ? subjectColor(sub) : 'var(--ink-soft)';
          }, 0);
        });
      });

      document.getElementById('student-form').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const subjects = fd.getAll('subjects');
        if (subjects.length === 0) { alert('Pick at least one subject.'); return; }
        const data = {
          name: fd.get('name').trim(),
          subjects,
          rate: parseFloat(fd.get('rate')) || 0,
          rateType: fd.get('rateType'),
          phone: fd.get('phone').trim()
        };
        if (existing) {
          Object.assign(existing, data);
        } else {
          state.students.push({ id: uid(), generalNotes: [], ...data });
        }
        saveData();
        closeModal();
        render();
      });
    }

    // ---- Add Session ----
    function sessionFormModal(existing) {
      if (state.students.length === 0) { studentFormModal(null); return; }
      const s = existing || {
        studentId: state.students[0].id,
        date: todayISO(),
        time: '15:00',
        duration: 60,
        subject: state.students[0].subjects[0],
        status: 'scheduled'
      };

      openModal(modalShell(
        existing ? 'Edit session' : 'Add session',
        `
          <form id="session-form">
            ${field('Student', `
              <select name="studentId" id="sess-student" class="${inputCls}">
                ${state.students.map(st => `
                  <option value="${st.id}" ${s.studentId === st.id ? 'selected' : ''}>${st.name}</option>
                `).join('')}
              </select>
            `)}
            ${field('Subject', `
              <select name="subject" id="sess-subject" class="${inputCls}"></select>
            `)}
            <div class="grid grid-cols-2 gap-3">
              ${field('Date', `<input required name="date" type="date" class="${inputCls}" value="${s.date}">`)}
              ${field('Time', `<input required name="time" type="time" class="${inputCls}" value="${s.time}">`)}
            </div>
            ${field('Duration (minutes)', `<input required name="duration" type="number" min="5" step="5" class="${inputCls}" value="${s.duration}">`)}
            <button type="submit" class="press w-full py-3 rounded-lg text-14px font-medium mt-2" style="background: var(--ink); color: var(--paper)">
              ${existing ? 'Save changes' : 'Add session'}
            </button>
          </form>
        `,
        ''
      ));

      function populateSubjects() {
        const st = studentById(document.getElementById('sess-student').value);
        const sel = document.getElementById('sess-subject');
        sel.innerHTML = st
          ? st.subjects.map(sub => `<option value="${sub}" ${sub === s.subject ? 'selected' : ''}>${sub}</option>`).join('')
          : SUBJECTNAMES.map(sub => `<option value="${sub}">${sub}</option>`).join('');
      }
      populateSubjects();
      document.getElementById('sess-student').addEventListener('change', populateSubjects);

      document.getElementById('session-form').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = {
          studentId: fd.get('studentId'),
          subject: fd.get('subject'),
          date: fd.get('date'),
          time: fd.get('time'),
          duration: parseInt(fd.get('duration'), 10)
        };
        if (existing) {
          Object.assign(existing, data);
        } else {
          state.sessions.push({ id: uid(), status: 'scheduled', note: '', ...data });
        }
        saveData();
        closeModal();
        render();
      });
    }

    // ---- Session quick-actions ----
    function sessionActionsModal(session) {
      const st = studentById(session.studentId);
      openModal(modalShell(
        st ? st.name : 'Session',
        `
          <p class="text-13.5px mb-4" style="color: var(--ink-soft)">
            ${session.subject} &middot; ${time12(session.time)} &middot; ${session.duration}min
          </p>
          <div class="grid grid-cols-2 gap-2.5 mb-4">
            <button data-action="mark-session" data-status="completed" data-id="${session.id}"
              class="press py-2.5 rounded-lg text-13.5px" style="background: var(--piano); color: white">Mark completed</button>
            <button data-action="mark-session" data-status="cancelled" data-id="${session.id}"
              class="press py-2.5 rounded-lg text-13.5px border" style="border-color: var(--hairline-strong)">Mark cancelled</button>
          </div>
          ${field('Note', `<textarea name="note" rows="2" class="${inputCls}" placeholder="What did you cover?">${session.note || ''}</textarea>`)}
          <button data-action="save-session-note" data-id="${session.id}"
            class="press w-full py-2.5 rounded-lg text-13.5px border mb-2" style="border-color: var(--hairline-strong)">Save note</button>
          <div class="flex gap-2 mt-3">
            <button data-action="edit-session" data-id="${session.id}"
              class="press flex-1 py-2.5 rounded-lg text-13.5px" style="background: var(--ink); color: var(--paper)">Edit</button>
            <button data-action="delete-session" data-id="${session.id}"
              class="press flex-1 py-2.5 rounded-lg text-13.5px" style="color: var(--danger)">Delete</button>
          </div>
        `,
        ''
      ));
    }

    // ---- Log payment ----
    function paymentFormModal(studentId) {
      if (state.students.length === 0) { studentFormModal(null); return; }
      const initial = studentId || state.students[0].id;
      const bal = Math.max(0, studentBalance(initial));

      openModal(modalShell(
        'Log payment',
        `
          <form id="payment-form">
            ${field('Student', `
              <select name="studentId" id="pay-student" class="${inputCls}">
                ${state.students.map(st => `
                  <option value="${st.id}" ${st.id === initial ? 'selected' : ''}>${st.name}</option>
                `).join('')}
              </select>
            `)}
            ${field('Amount', `<input required id="pay-amount" name="amount" type="number" step="0.01" min="0" class="${inputCls}" value="${bal > 0 ? bal.toFixed(2) : ''}" placeholder="0.00">`)}
            ${field('Date', `<input required name="date" type="date" class="${inputCls}" value="${todayISO()}">`)}
            ${field('Method (optional)', `
              <select name="method" class="${inputCls}">
                <option value="Not specified">Not specified</option>
                <option>Bank transfer</option>
                <option>Cash</option>
                <option>Card</option>
                <option>Other</option>
              </select>
            `)}
            ${field('Note (optional)', `<input name="note" class="${inputCls}" placeholder="e.g. covers last 3 sessions">`)}
            <button type="submit" class="press w-full py-3 rounded-lg text-14px font-medium mt-2" style="background: var(--ink); color: var(--paper)">Log payment</button>
          </form>
        `,
        ''
      ));

      document.getElementById('pay-student').addEventListener('change', e => {
        const b = Math.max(0, studentBalance(e.target.value));
        document.getElementById('pay-amount').value = b > 0 ? b.toFixed(2) : '';
      });

      document.getElementById('payment-form').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        state.payments.push({
          id: uid(),
          studentId: fd.get('studentId'),
          amount: parseFloat(fd.get('amount')) || 0,
          date: fd.get('date'),
          method: fd.get('method'),
          note: fd.get('note').trim()
        });
        saveData();
        closeModal();
        render();
      });
    }

    // ---- Add note ----
    function noteFormModal(studentId) {
      const s = studentById(studentId);
      if (!s) return;
      openModal(modalShell(
        'Add note',
        `
          <form id="note-form">
            ${field(s.name, `<textarea required name="text" rows="4" class="${inputCls}" placeholder="Progress, reminders, anything worth remembering..."></textarea>`)}
            <button type="submit" class="press w-full py-3 rounded-lg text-14px font-medium mt-2" style="background: var(--ink); color: var(--paper)">Save note</button>
          </form>
        `,
        ''
      ));

      document.getElementById('note-form').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        s.generalNotes = s.generalNotes || [];
        s.generalNotes.push({ id: uid(), date: todayISO(), text: fd.get('text').trim() });
        saveData();
        closeModal();
        render();
      });
    }

    // EVENT HANDLING
    function attachModalHandlers() {
      const root = document.getElementById('modal-root');
      root.querySelectorAll('[data-action="modal-close"]').forEach(b => b.addEventListener('click', closeModal));
      root.querySelector('[data-action="modal-backdrop"]').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeModal();
      });

      root.querySelectorAll('[data-action="mark-session"]').forEach(b => b.addEventListener('click', () => {
        const sess = state.sessions.find(s => s.id === b.dataset.id);
        if (sess) {
          sess.status = b.dataset.status;
          saveData();
          closeModal();
          render();
        }
      }));

      root.querySelectorAll('[data-action="save-session-note"]').forEach(b => b.addEventListener('click', () => {
        const sess = state.sessions.find(s => s.id === b.dataset.id);
        const ta = root.querySelector('textarea[name="note"]');
        if (sess) {
          sess.note = ta.value.trim();
          saveData();
          closeModal();
          render();
        }
      }));

      root.querySelectorAll('[data-action="edit-session"]').forEach(b => b.addEventListener('click', () => {
        const sess = state.sessions.find(s => s.id === b.dataset.id);
        if (sess) sessionFormModal(sess);
      }));

      root.querySelectorAll('[data-action="delete-session"]').forEach(b => b.addEventListener('click', () => {
        if (confirm('Delete this session?')) {
          state.sessions = state.sessions.filter(s => s.id !== b.dataset.id);
          saveData();
          closeModal();
          render();
        }
      }));

      root.querySelectorAll('[data-action="delete-student"]').forEach(b => b.addEventListener('click', () => {
        if (confirm('Delete this student and all their sessions and payments? This cannot be undone.')) {
          const id = b.dataset.id;
          state.students = state.students.filter(s => s.id !== id);
          state.sessions = state.sessions.filter(s => s.studentId !== id);
          state.payments = state.payments.filter(p => p.studentId !== id);
          saveData();
          closeModal();
          view = 'students';
          render();
        }
      }));
    }

    function attachHandlers() {
      const app = document.getElementById('app');
      app.querySelectorAll('[data-action="nav"]').forEach(el => el.addEventListener('click', () => {
        view = el.dataset.view;
        weekOffset = 0;
        render();
      }));

      const back = app.querySelector('[data-action="back-students"]');
      if (back) back.addEventListener('click', () => {
        view = 'students';
        openStudentId = null;
        render();
      });

      app.querySelectorAll('[data-action="open-student"]').forEach(el => el.addEventListener('click', () => {
        openStudentId = el.dataset.id;
        view = 'student';
        render();
      }));

      app.querySelectorAll('[data-action="open-session"]').forEach(el => el.addEventListener('click', () => {
        const sess = state.sessions.find(s => s.id === el.dataset.id);
        if (sess) sessionActionsModal(sess);
      }));

      app.querySelectorAll('[data-action="add-student"]').forEach(el => el.addEventListener('click', () => studentFormModal(null)));
      app.querySelectorAll('[data-action="edit-student"]').forEach(el => el.addEventListener('click', () => studentFormModal(studentById(el.dataset.id))));
      app.querySelectorAll('[data-action="add-session"]').forEach(el => el.addEventListener('click', () => sessionFormModal(null)));
      app.querySelectorAll('[data-action="log-payment"]').forEach(el => el.addEventListener('click', () => paymentFormModal(el.dataset.id)));
      app.querySelectorAll('[data-action="add-note"]').forEach(el => el.addEventListener('click', () => noteFormModal(el.dataset.id)));

      const prev = app.querySelector('[data-action="week-prev"]');
      if (prev) prev.addEventListener('click', () => { weekOffset--; render(); });
      const next = app.querySelector('[data-action="week-next"]');
      if (next) next.addEventListener('click', () => { weekOffset++; render(); });
    }

    loadData();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
