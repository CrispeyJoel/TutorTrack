<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ledger">
  <meta name="theme-color" content="#F1F0EA">
  <meta name="description" content="A quiet ledger for tutoring: schedule, students, payments and notes in one place.">
  <title>Ledger — Teaching Schedule</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --paper: #F1F0EA;
      --paper-raised: #FBFAF7;
      --ink: #1C2321;
      --ink-soft: #5B6360;
      --hairline: #DBDACF;
      --hairline-strong: #C7C6B9;
      --maths: #2B5FAD;
      --physics: #7A4FB5;
      --english: #B8862E;
      --piano: #2F7A5E;
      --percussion: #C4542D;
      --other: #6B6B63;
      --danger: #A33D3D;
      --nav-height: 72px;
    }
    html, body {
      margin: 0; padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif;
      overscroll-behavior-y: none;
      height: 100%;
      overflow: hidden;
    }
    .serif { font-family: 'Newsreader', serif; }
    .tabular { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { display: none; }
    .hairline { border-color: var(--hairline); }
    .press:active { transform: scale(0.96); opacity: 0.7; transition: transform 0.08s; }
    input, textarea, select {
      background: var(--paper-raised);
      border: 1px solid var(--hairline-strong);
      color: var(--ink);
      font-size: 16px; /* prevents zoom on mobile */
      border-radius: 12px;
      padding: 14px 16px;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(28,35,33,0.08);
    }
    input::placeholder, textarea::placeholder { color: #9A998D; }
    .modal-enter { animation: slideUp .25s ease-out; }
    @keyframes slideUp { from { transform: translateY(30px); opacity:0 } to { transform: translateY(0); opacity:1 } }
    .fade-enter { animation: fadeIn .15s ease-out; }
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .modal-enter, .fade-enter { animation: none; } }

    /* main layout: fixed header + scrollable content + fixed nav */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background: var(--paper);
      position: relative;
      overflow: hidden;
    }
    #scroll-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 16px 20px 16px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    #scroll-container > *:first-child { margin-top: 4px; }

    .fixed-header {
      flex-shrink: 0;
      background: var(--paper);
      padding: 18px 16px 8px 16px;
      position: sticky;
      top: 0;
      z-index: 15;
    }
    .bottom-nav {
      flex-shrink: 0;
      height: var(--nav-height);
      background: var(--paper-raised);
      border-top: 1px solid var(--hairline);
      display: flex;
      align-items: stretch;
      position: sticky;
      bottom: 0;
      z-index: 20;
      backdrop-filter: blur(2px);
    }
    .bottom-nav button {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-soft);
      padding: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      letter-spacing: 0.3px;
      transition: color 0.1s;
    }
    .bottom-nav button.active {
      color: var(--ink);
      font-weight: 600;
    }
    .bottom-nav button:active { background: rgba(0,0,0,0.03); }

    .card {
      background: var(--paper-raised);
      border: 1px solid var(--hairline);
      border-radius: 18px;
      padding: 16px 18px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-item {
      background: var(--paper-raised);
      border: 1px solid var(--hairline);
      border-radius: 18px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat-value {
      font-size: 28px;
      line-height: 1.1;
      font-family: 'Newsreader', serif;
    }
    .stat-label {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 4px;
    }
    .session-item {
      background: var(--paper-raised);
      border: 1px solid var(--hairline);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }
    .session-item .color-bar {
      width: 5px;
      align-self: stretch;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .student-item {
      background: var(--paper-raised);
      border: 1px solid var(--hairline);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .empty-state {
      border: 2px dashed var(--hairline-strong);
      border-radius: 24px;
      padding: 32px 20px;
      text-align: center;
      margin: 8px 0 16px 0;
    }
    .btn-primary {
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: 40px;
      padding: 14px 22px;
      font-size: 15px;
      font-weight: 500;
      width: 100%;
      transition: 0.1s;
    }
    .btn-primary:active { transform: scale(0.97); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--hairline-strong);
      border-radius: 40px;
      padding: 14px 22px;
      font-size: 15px;
      font-weight: 500;
      width: 100%;
      color: var(--ink);
    }
    .btn-outline:active { background: rgba(0,0,0,0.03); }
    .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 8px 14px;
      border-radius: 40px;
      font-size: 13px;
      border: 1px solid var(--hairline-strong);
      background: var(--paper-raised);
      cursor: default;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(28,35,33,0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 12px 0 12px;
      animation: fadeIn 0.2s;
    }
    .modal-sheet {
      background: var(--paper);
      width: 100%;
      max-width: 480px;
      max-height: 90dvh;
      border-radius: 28px 28px 0 0;
      padding: 0 20px 30px 20px;
      overflow-y: auto;
      animation: slideUp 0.25s ease-out;
      margin-bottom: 0;
    }
    .modal-handle {
      width: 40px;
      height: 5px;
      background: var(--hairline-strong);
      border-radius: 20px;
      margin: 14px auto 12px auto;
    }
    .text-soft { color: var(--ink-soft); }
    .text-danger { color: var(--danger); }
    .bg-soft { background: var(--paper-raised); }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 14px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 14px; }
    .mb-4 { margin-bottom: 20px; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .shrink-0 { flex-shrink: 0; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .w-full { width: 100%; }
    .text-center { text-align: center; }
    .text-sm { font-size: 14px; }
    .text-base { font-size: 16px; }
    .text-lg { font-size: 20px; }
    .text-xl { font-size: 24px; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .leading-none { line-height: 1; }
    .relative { position: relative; }
    .sticky { position: sticky; }
    .top-0 { top: 0; }
    .z-10 { z-index: 10; }
    .overflow-y-auto { overflow-y: auto; }
    .flex-1 { flex: 1; }
    .min-h-0 { min-height: 0; }
    .gap-1 { gap: 4px; }
    .gap-2 { gap: 8px; }

    /* big tap targets */
    button, .press { cursor: pointer; touch-action: manipulation; }
    input, select, textarea { font-size: 16px !important; }
    .modal-sheet button { min-height: 52px; }
    .bottom-nav button { min-height: 64px; }
  </style>
</head>
<body>
<div id="app">
  <!-- fixed header (dynamic) -->
  <div id="fixed-header" class="fixed-header"></div>
  <!-- scrollable body -->
  <div id="scroll-container"></div>
  <!-- fixed bottom nav -->
  <div id="bottom-nav" class="bottom-nav"></div>
</div>
<div id="modal-root"></div>

<script>
/* ============================= DATA ============================= */
const SUBJECTS = {
  Maths:      '#2B5FAD',
  Physics:    '#7A4FB5',
  English:    '#B8862E',
  Piano:      '#2F7A5E',
  Percussion: '#C4542D',
  Other:      '#6B6B63',
};
const SUBJECT_NAMES = Object.keys(SUBJECTS);
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

let state = { students: [], sessions: [], payments: [] };
let loaded = false;
let view = 'today';
let weekOffset = 0;
let openStudentId = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

const STORAGE_KEY = 'ledger-data';
async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ /* no data */ }
  loaded = true;
  render();
}
let saveTimer = null;
function saveData(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('save failed', e); }
  }, 120);
}

/* ============================= HELPERS ============================= */
function fmtMoney(n){ const v = Math.round((n + Number.EPSILON) * 100) / 100; return (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2); }
function pad(n){ return n.toString().padStart(2,'0'); }
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function isoToDate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function dateToISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(iso, n){ const d = isoToDate(iso); d.setDate(d.getDate()+n); return dateToISO(d); }
function dayLabel(iso, opts){ opts = opts || {}; const d = isoToDate(iso);
  const weekday = d.toLocaleDateString('en-AU', { weekday: opts.short ? 'short' : 'long' });
  const md = d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
  return { weekday, md };
}
function time12(t){ if(!t) return ''; let [h,m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12; if(h===0) h = 12; return h + (m ? ':' + pad(m) : '') + ap; }
function startOfWeek(iso){ const d = isoToDate(iso); const dow = d.getDay(); const diff = (dow === 0 ? -6 : 1) - dow; d.setDate(d.getDate() + diff); return dateToISO(d); }
function studentById(id){ return state.students.find(s => s.id === id); }
function subjectColor(name){ return SUBJECTS[name] || SUBJECTS.Other; }

function sessionCost(session){
  const st = studentById(session.studentId);
  if(!st) return 0;
  if(st.rateType === 'hour') return (st.rate || 0) * (session.duration || 0) / 60;
  return st.rate || 0;
}
function studentBalance(studentId){
  const earned = state.sessions.filter(s => s.studentId === studentId && s.status === 'completed').reduce((sum,s) => sum + sessionCost(s), 0);
  const paid = state.payments.filter(p => p.studentId === studentId).reduce((sum,p) => sum + p.amount, 0);
  return earned - paid;
}
function totalOutstanding(){ return state.students.reduce((sum,s) => sum + Math.max(0, studentBalance(s.id)), 0); }
function hoursThisWeek(){
  const start = startOfWeek(todayISO());
  const end = addDays(start, 6);
  return state.sessions.filter(s => s.date >= start && s.date <= end && s.status !== 'cancelled')
    .reduce((sum,s) => sum + (s.duration||0), 0) / 60;
}
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

/* ============================= RENDER ============================= */
function render(){
  if(!loaded) return;
  const header = document.getElementById('fixed-header');
  const container = document.getElementById('scroll-container');
  const nav = document.getElementById('bottom-nav');

  // header
  header.innerHTML = renderHeader();

  // body - using replaceChildren for cleaner replacement
  const body = view === 'student' ? renderStudentDetail(openStudentId)
    : view === 'schedule' ? renderSchedule()
    : view === 'students' ? renderStudents()
    : view === 'payments' ? renderPayments()
    : renderToday();
  const wrapper = document.createElement('div');
  wrapper.className = 'fade-enter';
  wrapper.innerHTML = body;
  container.replaceChildren(wrapper);
  container.scrollTop = 0;

  // nav
  nav.innerHTML = renderTabBar();

  attachHandlers();
}

function renderHeader(){
  if(view === 'student'){
    const s = studentById(openStudentId);
    if(!s) { view = 'students'; return renderHeader(); }
    return `
      <div class="flex items-center gap-2">
        <button data-action="back-students" class="press text-base font-medium" style="color:var(--ink-soft);">← Students</button>
        <span class="serif text-xl font-medium truncate flex-1">${s.name}</span>
      </div>`;
  }
  const titles = { today: 'Today', schedule: 'Schedule', students: 'Students', payments: 'Payments' };
  const d = new Date();
  const dateStr = d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
  return `
    <div class="flex items-end justify-between">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="serif text-3xl leading-none font-medium">${titles[view]}</h1>
        </div>
        ${view === 'today' ? `<p class="text-sm text-soft mt-1">${dateStr}</p>` : ''}
      </div>
    </div>`;
}

function renderTabBar(){
  const tabs = [
    { id: 'today', label: 'Today' },
    { id: 'schedule', label: 'Schedule' },
    { id: 'students', label: 'Students' },
    { id: 'payments', label: 'Payments' },
  ];
  const active = view === 'student' ? 'students' : view;
  return tabs.map(t => `
    <button data-action="nav" data-view="${t.id}" class="${active === t.id ? 'active' : ''}">
      ${t.label}
    </button>
  `).join('');
}

/* ============================= TODAY ============================= */
function renderToday(){
  const today = todayISO();
  const sessions = state.sessions.filter(s => s.date === today).sort((a,b) => a.time.localeCompare(b.time));
  const outstanding = totalOutstanding();
  const hrs = hoursThisWeek();

  const stats = `
    <div class="stat-grid">
      <div class="stat-item"><div class="stat-value">${sessions.length}</div><div class="stat-label">sessions today</div></div>
      <div class="stat-item"><div class="stat-value">${hrs.toFixed(1)}</div><div class="stat-label">hrs this week</div></div>
      <div class="stat-item"><div class="stat-value" style="color:${outstanding>0?'var(--danger)':'var(--ink)'};">${fmtMoney(outstanding)}</div><div class="stat-label">owed to you</div></div>
    </div>`;

  const list = sessions.length === 0
    ? `<div class="empty-state"><p class="serif text-lg">Nothing scheduled today</p><p class="text-sm text-soft mt-1">Add a session to get your day on the ledger.</p><button data-action="add-session" class="btn-primary mt-3">+ Add session</button></div>`
    : `<div class="space-y-2">${sessions.map(sessionRow).join('')}</div>`;

  return `
    ${stats}
    <div class="flex items-center justify-between mb-3">
      <span class="text-sm font-medium text-soft">Today's sessions</span>
      <button data-action="add-session" class="press text-sm font-semibold" style="color:var(--ink);">+ Add session</button>
    </div>
    ${list}
  `;
}

function sessionRow(s){
  const st = studentById(s.studentId);
  if(!st) return '';
  const color = subjectColor(s.subject);
  const done = s.status === 'completed';
  const cancelled = s.status === 'cancelled';
  return `
    <div data-action="open-session" data-id="${s.id}" class="session-item press" style="opacity:${cancelled?'0.5':'1'};">
      <div class="color-bar" style="background:${color};"></div>
      <div class="flex-1 min-w-0">
        <div class="flex items-baseline gap-2">
          <span class="text-base font-medium truncate">${st.name}</span>
          <span class="text-sm text-soft shrink-0">${s.subject}</span>
        </div>
        <div class="text-sm text-soft">${time12(s.time)} · ${s.duration}min${cancelled?' · cancelled':''}</div>
      </div>
      ${done ? `<span class="text-xs px-3 py-1 rounded-full shrink-0" style="background:var(--piano);color:white;">Done</span>` : ''}
    </div>`;
}

/* ============================= SCHEDULE ============================= */
function renderSchedule(){
  const base = addDays(startOfWeek(todayISO()), weekOffset * 7);
  const days = Array.from({length:7}, (_,i) => addDays(base, i));
  const weekEnd = days[6];
  const label = weekOffset === 0 ? 'This week' : (isoToDate(base).toLocaleDateString('en-AU',{day:'numeric',month:'short'}) + ' – ' + isoToDate(weekEnd).toLocaleDateString('en-AU',{day:'numeric',month:'short'}));

  const rows = days.map(iso => {
    const daySessions = state.sessions.filter(s => s.date === iso).sort((a,b) => a.time.localeCompare(b.time));
    const { weekday, md } = dayLabel(iso, { short: true });
    const isToday = iso === todayISO();
    return `
      <div class="mb-4">
        <div class="flex items-baseline gap-2 mb-2">
          <span class="text-sm font-medium" style="color:${isToday?'var(--ink)':'var(--ink-soft)'};">${weekday}</span>
          <span class="text-sm text-soft">${md}</span>
          ${isToday ? `<span class="w-2 h-2 rounded-full" style="background:var(--physics);"></span>` : ''}
        </div>
        ${daySessions.length === 0 ? `<p class="text-sm text-soft pl-1">—</p>` :
          `<div class="space-y-2">${daySessions.map(sessionRow).join('')}</div>`}
      </div>`;
  }).join('');

  return `
    <div class="flex items-center justify-between mb-4">
      <button data-action="week-prev" class="press text-xl px-3" style="color:var(--ink-soft);">‹</button>
      <span class="text-base font-medium">${label}</span>
      <button data-action="week-next" class="press text-xl px-3" style="color:var(--ink-soft);">›</button>
    </div>
    ${rows}
    <button data-action="add-session" class="btn-outline mt-2">+ Add session</button>
  `;
}

/* ============================= STUDENTS ============================= */
function renderStudents(){
  const students = [...state.students].sort((a,b) => a.name.localeCompare(b.name));
  if(students.length === 0){
    return `<div class="empty-state"><p class="serif text-lg">No students yet</p><p class="text-sm text-soft mt-1">Add your first student to start tracking lessons.</p><button data-action="add-student" class="btn-primary mt-3">+ Add student</button></div>`;
  }
  return `
    <div class="space-y-2">
      ${students.map(s => {
        const bal = studentBalance(s.id);
        return `
        <div data-action="open-student" data-id="${s.id}" class="student-item press">
          <div class="flex-1 min-w-0">
            <div class="text-base font-medium truncate">${s.name}</div>
            <div class="flex flex-wrap gap-1 mt-1">
              ${s.subjects.map(sub => `<span class="text-xs px-2 py-0.5 rounded-full" style="background:${hexToRgba(subjectColor(sub),0.12)};color:${subjectColor(sub)};">${sub}</span>`).join('')}
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-base tabular font-medium" style="color:${bal>0?'var(--danger)':'var(--ink-soft)'};">${fmtMoney(Math.max(bal,0))}</div>
            <div class="text-xs text-soft">${bal>0?'owed':'settled'}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <button data-action="add-student" class="btn-primary mt-3" onclick="studentFormModal(null)">+ Add student</button>
  `;
}

function renderStudentDetail(id){
  const s = studentById(id);
  if(!s) return '';
  const sessions = state.sessions.filter(x => x.studentId === id).sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));
  const payments = state.payments.filter(x => x.studentId === id).sort((a,b) => b.date.localeCompare(a.date));
  const bal = studentBalance(id);
  const notes = s.generalNotes || [];

  return `
    <div class="card mb-4">
      <div class="flex flex-wrap gap-1 mt-1">
        ${s.subjects.map(sub => `<span class="text-xs px-2 py-0.5 rounded-full" style="background:${hexToRgba(subjectColor(sub),0.12)};color:${subjectColor(sub)};">${sub}</span>`).join('')}
      </div>
      <div class="flex items-center gap-3 mt-2 flex-wrap">
        <span class="text-sm text-soft">${s.rateType==='hour'?fmtMoney(s.rate)+'/hr':fmtMoney(s.rate)+'/session'}</span>
        ${s.phone ? `<span class="text-sm text-soft">· ${s.phone}</span>` : ''}
      </div>
      <div class="flex gap-2 mt-3">
        <button data-action="edit-student" data-id="${s.id}" class="btn-outline flex-1">Edit</button>
        <button data-action="log-payment" data-id="${s.id}" class="btn-primary flex-1">Log payment</button>
      </div>
    </div>

    <div class="card mb-4 flex items-center justify-between">
      <span class="text-sm text-soft">Balance</span>
      <span class="serif text-xl tabular" style="color:${bal>0?'var(--danger)':'var(--ink)'};">${fmtMoney(bal)}</span>
    </div>

    <div class="mb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-medium text-soft">Notes</span>
        <button data-action="add-note" data-id="${s.id}" class="press text-sm font-semibold">+ Add note</button>
      </div>
      ${notes.length === 0 ? `<p class="text-sm text-soft">No notes yet.</p>` :
        `<div class="space-y-2">${notes.slice().reverse().map(n => `
          <div class="card p-3"><p class="text-sm">${escapeHtml(n.text)}</p><p class="text-xs text-soft mt-1">${isoToDate(n.date).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}</p></div>
        `).join('')}</div>`}
    </div>

    <div class="mb-4">
      <span class="text-sm font-medium text-soft">Session history</span>
      ${sessions.length === 0 ? `<p class="text-sm text-soft mt-1">No sessions logged yet.</p>` :
        `<div class="space-y-2 mt-2">${sessions.map(sessionRow).join('')}</div>`}
    </div>

    <div>
      <span class="text-sm font-medium text-soft">Payment history</span>
      ${payments.length === 0 ? `<p class="text-sm text-soft mt-1">No payments logged yet.</p>` :
        `<div class="space-y-2 mt-2">${payments.map(p => `
          <div class="card flex items-center justify-between p-3">
            <div><div class="text-sm">${p.method||'Payment'}</div><div class="text-xs text-soft">${isoToDate(p.date).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}${p.note?' · '+escapeHtml(p.note):''}</div></div>
            <div class="text-base tabular font-medium">${fmtMoney(p.amount)}</div>
          </div>
        `).join('')}</div>`}
    </div>
  `;
}

/* ============================= PAYMENTS ============================= */
function renderPayments(){
  const owing = state.students.map(s => ({ s, bal: studentBalance(s.id) })).filter(x => x.bal > 0.004).sort((a,b) => b.bal - a.bal);
  const allPayments = [...state.payments].sort((a,b) => b.date.localeCompare(a.date));

  let owingBlock = '';
  if(owing.length){
    owingBlock = `
      <div class="mb-4">
        <span class="text-sm font-medium text-soft">Outstanding</span>
        <div class="space-y-2 mt-2">
          ${owing.map(({s,bal}) => `
            <div data-action="open-student" data-id="${s.id}" class="student-item press">
              <span class="text-base">${s.name}</span>
              <span class="text-base tabular font-medium text-danger ml-auto">${fmtMoney(bal)}</span>
            </div>`).join('')}
        </div>
      </div>`;
  }

  const historyBlock = allPayments.length === 0
    ? `<div class="empty-state"><p class="serif text-lg">No payments logged</p><p class="text-sm text-soft mt-1">Log a payment as it comes in to keep balances current.</p><button data-action="log-payment" class="btn-primary mt-3">Log payment</button></div>`
    : `<div><span class="text-sm font-medium text-soft">History</span><div class="space-y-2 mt-2">${allPayments.map(p => {
        const st = studentById(p.studentId);
        return `<div class="card flex items-center justify-between p-3"><div><div class="text-sm">${st?st.name:'Unknown'}</div><div class="text-xs text-soft">${isoToDate(p.date).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}${p.method?' · '+p.method:''}</div></div><div class="text-base tabular font-medium">${fmtMoney(p.amount)}</div></div>`;
      }).join('')}</div></div>`;

  return owingBlock + historyBlock + (allPayments.length ? `<button data-action="log-payment" class="btn-outline mt-3">+ Log payment</button>` : '');
}

/* ============================= MODALS ============================= */
function openModal(html){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" data-action="modal-backdrop">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        ${html}
      </div>
    </div>`;
  attachModalHandlers();
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function modalShell(title, bodyHtml, footerHtml){
  return `
    <div class="flex items-center justify-between mb-3">
      <h2 class="serif text-xl font-medium">${title}</h2>
      <button data-action="modal-close" class="press text-2xl leading-none px-2" style="color:var(--ink-soft);">×</button>
    </div>
    ${bodyHtml}
    ${footerHtml || ''}
  `;
}
function field(label, inputHtml){
  return `<div class="mb-4"><label class="block text-sm font-medium text-soft mb-1.5">${label}</label>${inputHtml}</div>`;
}

/* ---- Student form ---- */
function studentFormModal(existing){
  const s = existing || { name:'', subjects:[], rate:'', rateType:'hour', phone:'' };
  openModal(modalShell(existing ? 'Edit student' : 'Add student', `
    <form id="student-form">
      ${field('Name', `<input required name="name" value="${s.name}" placeholder="Student name" />`)}
      ${field('Subjects', `
        <div class="chip-group">
          ${SUBJECT_NAMES.map(sub => `
            <label class="chip press" style="border-color:${s.subjects.includes(sub)?subjectColor(sub):'var(--hairline-strong)'};color:${s.subjects.includes(sub)?subjectColor(sub):'var(--ink-soft)'};">
              <input type="checkbox" name="subjects" value="${sub}" class="hidden" ${s.subjects.includes(sub)?'checked':''}/>${sub}
            </label>`).join('')}
        </div>`)}
      <div class="grid grid-cols-2 gap-3">
        ${field('Rate', `<input required name="rate" type="number" step="0.01" min="0" value="${s.rate}" placeholder="0.00" />`)}
        ${field('Per', `<select name="rateType"><option value="hour" ${s.rateType==='hour'?'selected':''}>Hour</option><option value="session" ${s.rateType==='session'?'selected':''}>Session</option></select>`)}
      </div>
      ${field('Phone (optional)', `<input name="phone" value="${s.phone||''}" placeholder="04xx xxx xxx" />`)}
      <button type="submit" class="btn-primary">${existing ? 'Save changes' : 'Add student'}</button>
      ${existing ? `<button type="button" data-action="delete-student" data-id="${existing.id}" class="btn-outline mt-2 text-danger" style="color:var(--danger);border-color:var(--danger);">Delete student</button>` : ''}
    </form>
  `));
  document.querySelectorAll('.chip').forEach(label => {
    label.addEventListener('click', (e) => {
      const cb = label.querySelector('input'); const sub = cb.value;
      setTimeout(() => {
        const checked = cb.checked;
        label.style.borderColor = checked ? subjectColor(sub) : 'var(--hairline-strong)';
        label.style.color = checked ? subjectColor(sub) : 'var(--ink-soft)';
      }, 0);
    });
  });
  document.getElementById('student-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const subjects = fd.getAll('subjects');
    if(subjects.length === 0){ alert('Pick at least one subject.'); return; }
    const data = { name: fd.get('name').trim(), subjects, rate: parseFloat(fd.get('rate')) || 0, rateType: fd.get('rateType'), phone: fd.get('phone').trim() };
    if(existing){ Object.assign(existing, data); }
    else { state.students.push({ id: uid(), generalNotes: [], ...data }); }
    saveData(); closeModal(); render();
  });
}

/* ---- Session form ---- */
function sessionFormModal(existing){
  if(state.students.length === 0){ studentFormModal(null); return; }
  const s = existing || { studentId: state.students[0].id, date: todayISO(), time: '15:00', duration: 60, subject: state.students[0].subjects[0], status: 'scheduled' };
  openModal(modalShell(existing ? 'Edit session' : 'Add session', `
    <form id="session-form">
      ${field('Student', `<select name="studentId" id="sess-student">${state.students.map(st => `<option value="${st.id}" ${s.studentId===st.id?'selected':''}>${st.name}</option>`).join('')}</select>`)}
      ${field('Subject', `<select name="subject" id="sess-subject"></select>`)}
      <div class="grid grid-cols-2 gap-3">
        ${field('Date', `<input required name="date" type="date" value="${s.date}" />`)}
        ${field('Time', `<input required name="time" type="time" value="${s.time}" />`)}
      </div>
      ${field('Duration (minutes)', `<input required name="duration" type="number" min="5" step="5" value="${s.duration}" />`)}
      <button type="submit" class="btn-primary">${existing ? 'Save changes' : 'Add session'}</button>
    </form>
  `));
  function populateSubjects(){
    const st = studentById(document.getElementById('sess-student').value);
    const sel = document.getElementById('sess-subject');
    sel.innerHTML = (st ? st.subjects : SUBJECT_NAMES).map(sub => `<option value="${sub}" ${sub===s.subject?'selected':''}>${sub}</option>`).join('');
  }
  populateSubjects();
  document.getElementById('sess-student').addEventListener('change', populateSubjects);
  document.getElementById('session-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = { studentId: fd.get('studentId'), subject: fd.get('subject'), date: fd.get('date'), time: fd.get('time'), duration: parseInt(fd.get('duration'),10) };
    if(existing){ Object.assign(existing, data); }
    else { state.sessions.push({ id: uid(), status: 'scheduled', note: '', ...data }); }
    saveData(); closeModal(); render();
  });
}

/* ---- Session actions ---- */
function sessionActionsModal(session){
  const st = studentById(session.studentId);
  openModal(modalShell(st ? st.name : 'Session', `
    <p class="text-base text-soft mb-3">${session.subject} · ${time12(session.time)} · ${session.duration}min</p>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <button data-action="mark-session" data-status="completed" data-id="${session.id}" class="btn-primary" style="background:var(--piano);">Mark completed</button>
      <button data-action="mark-session" data-status="cancelled" data-id="${session.id}" class="btn-outline">Mark cancelled</button>
    </div>
    ${field('Note', `<textarea name="note" rows="2" placeholder="What did you cover?">${session.note||''}</textarea>`)}
    <button data-action="save-session-note" data-id="${session.id}" class="btn-outline mb-2">Save note</button>
    <div class="flex gap-2">
      <button data-action="edit-session" data-id="${session.id}" class="btn-primary flex-1">Edit</button>
      <button data-action="delete-session" data-id="${session.id}" class="btn-outline flex-1 text-danger" style="color:var(--danger);border-color:var(--danger);">Delete</button>
    </div>
  `));
}

/* ---- Payment form ---- */
function paymentFormModal(studentId){
  if(state.students.length === 0){ studentFormModal(null); return; }
  const initial = studentId || state.students[0].id;
  const bal = Math.max(0, studentBalance(initial));
  openModal(modalShell('Log payment', `
    <form id="payment-form">
      ${field('Student', `<select name="studentId" id="pay-student">${state.students.map(st => `<option value="${st.id}" ${st.id===initial?'selected':''}>${st.name}</option>`).join('')}</select>`)}
      ${field('Amount', `<input required id="pay-amount" name="amount" type="number" step="0.01" min="0" value="${bal>0?bal.toFixed(2):''}" placeholder="0.00" />`)}
      ${field('Date', `<input required name="date" type="date" value="${todayISO()}" />`)}
      ${field('Method (optional)', `<select name="method"><option value="">Not specified</option><option>Bank transfer</option><option>Cash</option><option>Card</option><option>Other</option></select>`)}
      ${field('Note (optional)', `<input name="note" placeholder="e.g. covers last 3 sessions" />`)}
      <button type="submit" class="btn-primary">Log payment</button>
    </form>
  `));
  document.getElementById('pay-student').addEventListener('change', (e) => {
    const b = Math.max(0, studentBalance(e.target.value));
    document.getElementById('pay-amount').value = b > 0 ? b.toFixed(2) : '';
  });
  document.getElementById('payment-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    state.payments.push({ id: uid(), studentId: fd.get('studentId'), amount: parseFloat(fd.get('amount'))||0, date: fd.get('date'), method: fd.get('method'), note: fd.get('note').trim() });
    saveData(); closeModal(); render();
  });
}

/* ---- Note form ---- */
function noteFormModal(studentId){
  const s = studentById(studentId);
  if(!s) return;
  openModal(modalShell('Add note', `
    <form id="note-form">
      ${field(s.name, `<textarea required name="text" rows="4" placeholder="Progress, reminders, anything worth remembering..."></textarea>`)}
      <button type="submit" class="btn-primary">Save note</button>
    </form>
  `));
  document.getElementById('note-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    s.generalNotes = s.generalNotes || [];
    s.generalNotes.push({ id: uid(), date: todayISO(), text: fd.get('text').trim() });
    saveData(); closeModal(); render();
  });
}

/* ============================= EVENT HANDLING ============================= */
function attachModalHandlers(){
  const root = document.getElementById('modal-root');
  root.querySelectorAll('[data-action="modal-close"]').forEach(b => b.addEventListener('click', closeModal));
  root.querySelector('[data-action="modal-backdrop"]').addEventListener('click', (e) => { if(e.target === e.currentTarget) closeModal(); });
  root.querySelectorAll('[data-action="mark-session"]').forEach(b => b.addEventListener('click', () => {
    const sess = state.sessions.find(s => s.id === b.dataset.id);
    if(sess){ sess.status = b.dataset.status; saveData(); closeModal(); render(); }
  }));
  root.querySelectorAll('[data-action="save-session-note"]').forEach(b => b.addEventListener('click', () => {
    const sess = state.sessions.find(s => s.id === b.dataset.id);
    const ta = root.querySelector('textarea[name="note"]');
    if(sess){ sess.note = ta.value.trim(); saveData(); closeModal(); render(); }
  }));
  root.querySelectorAll('[data-action="edit-session"]').forEach(b => b.addEventListener('click', () => {
    const sess = state.sessions.find(s => s.id === b.dataset.id);
    if(sess) sessionFormModal(sess);
  }));
  root.querySelectorAll('[data-action="delete-session"]').forEach(b => b.addEventListener('click', () => {
    if(confirm('Delete this session?')){
      state.sessions = state.sessions.filter(s => s.id !== b.dataset.id);
      saveData(); closeModal(); render();
    }
  }));
  root.querySelectorAll('[data-action="delete-student"]').forEach(b => b.addEventListener('click', () => {
    if(confirm('Delete this student and all their sessions and payments? This cannot be undone.')){
      const id = b.dataset.id;
      state.students = state.students.filter(s => s.id !== id);
      state.sessions = state.sessions.filter(s => s.studentId !== id);
      state.payments = state.payments.filter(p => p.studentId !== id);
      saveData(); closeModal(); view = 'students'; render();
    }
  }));
}

function attachHandlers(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-action="nav"]').forEach(el => el.addEventListener('click', () => { view = el.dataset.view; weekOffset = 0; render(); }));
  const back = app.querySelector('[data-action="back-students"]');
  if(back) back.addEventListener('click', () => { view = 'students'; openStudentId = null; render(); });
  app.querySelectorAll('[data-action="open-student"]').forEach(el => el.addEventListener('click', () => { openStudentId = el.dataset.id; view = 'student'; render(); }));
  app.querySelectorAll('[data-action="open-session"]').forEach(el => el.addEventListener('click', () => {
    const sess = state.sessions.find(s => s.id === el.dataset.id);
    if(sess) sessionActionsModal(sess);
  }));
  app.querySelectorAll('[data-action="add-student"]').forEach(el => el.addEventListener('click', () => studentFormModal(null)));
  app.querySelectorAll('[data-action="edit-student"]').forEach(el => el.addEventListener('click', () => studentFormModal(studentById(el.dataset.id))));
  app.querySelectorAll('[data-action="add-session"]').forEach(el => el.addEventListener('click', () => sessionFormModal(null)));
  app.querySelectorAll('[data-action="log-payment"]').forEach(el => el.addEventListener('click', () => paymentFormModal(el.dataset.id)));
  app.querySelectorAll('[data-action="add-note"]').forEach(el => el.addEventListener('click', () => noteFormModal(el.dataset.id)));
  const prev = app.querySelector('[data-action="week-prev"]'); if(prev) prev.addEventListener('click', () => { weekOffset--; render(); });
  const next = app.querySelector('[data-action="week-next"]'); if(next) next.addEventListener('click', () => { weekOffset++; render(); });
  
  // ADD THIS LINE - direct handler for empty state button
  document.querySelector('[data-action="add-student"]')?.addEventListener('click', () => studentFormModal(null));
}
</script>
</body>
</html>
